     was worse still: "Cashewkerne" shares no word with "Nüsse", and seven products lost their only
     usable hint. So the word decides the order and the category decides ties — and still carries a
     candidate on its own when no word matches at all. Matching shared compound tails ("Speiseöl"
     from "Olivenöl") was tried and reverted: German plurals end in "-en", so "Tomaten" matched
     "Linsen" and "Kerne" matched "Damenhygiene" — more noise than the two cases it fixed. */
  return out
    .sort((a, b) => (b.wordScore - a.wordScore)
                 || ((b.sameCat ? 1 : 0) - (a.sameCat ? 1 : 0))
                 || (b.habit - a.habit))
    .slice(0, 3);
}

/* Products that look like the same thing. Scanning a second packet of something you already
   have should offer to book onto it rather than quietly create a twin — the duplicate is only
   noticed later, when the counts do not add up. */
function similarProducts(name, excludePk) {
  const own = words(name).filter(strongWord);
  if (!own.length) return [];

  const out = [];
  for (const p of PARTS.values()) {
    if (p.is_template || p.pk === excludePk) continue;
    const plain = String(p.name || "").toLowerCase();
    let hits = 0;
    for (const w of own) if (plain.indexOf(w) >= 0) hits += 1;
    if (hits >= 2 || (hits === 1 && own.length === 1)) out.push({ p: p, hits: hits });
  }
  return out.sort((a, b) => b.hits - a.hits).slice(0, 3);
}

/* Create a product from a barcode nothing recognised, and bind the barcode to it in the same
   go. Two calls, and the order matters the usual way: the part is created first, so a failure
   to link leaves an article you can find and fix rather than a barcode pointing at nothing. */
function panelNewArticle(host, code) {
  openPanel(host, (p) => {
    const name = el("input", { type: "text" });
    name.placeholder = t("article.namePlaceholder");

    const cat = el("select");
    for (const c of CATEGORIES) {
      cat.append(el("option", { value: String(c.pk), textContent: c.pathstring }));
    }

    const req = el("select");
    req.append(el("option", { value: "", textContent: t("requirement.none") }));
    for (const tpl of [...PARTS.values()].filter((x) => x.is_template)
                     .sort((a, b) => byName(a.name, b.name))) {
      req.append(el("option", { value: String(tpl.pk), textContent: tpl.full_name || tpl.name }));
    }

    const sugBox = el("div", { className: "suggest" });
    const simBox = el("div", { className: "hint" });

    /* Recomputed while typing, because for a barcode nothing recognised the name is the only
       signal there is — there is no category from Open Food Facts to narrow by. */
    const refresh = () => {
      sugBox.innerHTML = "";
      for (const cand of suggestRequirements(name.value, Number(cat.value))) {
        const btn = el("button", {
          className: "btn", textContent: cand.t.full_name || cand.t.name,
        });
        btn.title = cand.why;
        btn.onclick = () => { req.value = String(cand.t.pk); refresh(); };
        sugBox.append(btn);
      }
      const sim = similarProducts(name.value, null);
      simBox.textContent = sim.length
        ? t("article.similarExists", { names: sim.map((c) => c.p.full_name || c.p.name).join(", ") })
        : "";
      simBox.hidden = !sim.length;
    };
    name.addEventListener("input", refresh);
    cat.addEventListener("change", refresh);

    p.append(field(t("field.name"), name), field(t("field.category"), cat));
    p.append(sugBox, simBox);
    p.append(field(t("field.requirementOptional"), req));
    p.append(el("div", { className: "hint", textContent: t("article.barcode", { code: code }) }));
    refresh();

    panelButtons(p, t("common.create"), async () => {
      if (!name.value.trim()) throw new Error(t("error.nameMissing"));
    const created = await api("/part/", {
      method: "POST",
      body: {
        name: name.value.trim(), description: "", category: Number(cat.value),
        variant_of: req.value ? Number(req.value) : null,
        purchaseable: true, active: true, minimum_stock: 0,
      },
    });
    PARTS.set(created.pk, created);
    try {
      await api("/barcode/link/", {
        method: "POST", body: { barcode: code, part: created.pk },
      });
    } catch (e) {
      toast(t("article.linkFailed", { error: e.message }), true);
    }
    $("#ean").value = "";
    toast(t("article.createdLinked"));
    openPart(created.pk, "scan");
    });
  });
}

async function showPart(pk) {
  closePanel();
  const gen = ++CARD_GEN;
  const host = $("#detail");

  /* Clear first. The detail view keeps its DOM while hidden, so without this the previous
     article stays on screen until the new data lands — briefly showing someone the wrong
     stock. In its place goes what the overview already knows (the name), so the page has an
     identity straight away instead of flashing empty. */
  host.innerHTML = "";
  const known = STOCK_ALL.find((i) => i.part === pk);
  if (known && known.part_detail) {
    const skel = el("div", { className: "card" });
    skel.append(el("h2", { className: "sec", textContent: t("detail.general") }));
    skel.append(el("div", { className: "name", textContent: known.part_detail.full_name }));
    skel.append(el("div", { className: "hint", textContent: t("common.loading") }));
    host.append(skel);
  }

  // In series these cost the sum of both round trips for no reason — neither needs the other.
  const [part, items] = await Promise.all([api("/part/" + pk + "/"), loadStock(pk)]);
  if (gen !== CARD_GEN) return;   // another article was opened while this one was loading
  host.innerHTML = "";

  // ---- identity + picture ----
  /* Declared here, before the first use. It used to sit down with the facts, which put the
     picture block above its own declaration — valid syntax, dead page: a `const` read before
     its line throws rather than being undefined. */
  const isRequirement = !!part.is_template;

  const c = el("div", { className: "card" });
  c.append(el("h2", { className: "sec", textContent: t("detail.general") }));
  const head = el("div", { className: "detailhead" });
  /* Only a product gets a picture. A requirement is the abstract thing you shop for — there is
     no photograph of "Nudeln", and an empty frame only invites filling it with whichever brand
     happened to be in the cupboard. The photos belong to the varieties, and that is where they
     earn their place: recognising the one in the blue bag. */
  const thumb = isRequirement ? null : thumbPicker(part, () => showPart(pk));
  if (thumb) head.append(thumb.wrap);

  const txt = el("div", { className: "grow" });
  txt.append(el("div", { className: "name", textContent: part.full_name || part.name }));
  if (part.category_name) {
    txt.append(el("div", { className: "meta", textContent: part.category_name }));
  }
  if ((part.keywords || "").trim()) {
    txt.append(el("div", { className: "meta", textContent: part.keywords }));
  }
  head.append(txt);
  head.append(pencilButton(t("article.edit"), () => panelArticle(c, part, items)));
  head.append(trashButton(part.is_template ? t("requirement.delete") : t("article.delete"),
                        () => panelDeletePart(c, part, items)));
  c.append(head);

  if (thumb) {
    const shoot = labelButton("ghost", "camera", t("photo.take"));
    const choose = labelButton("ghost", "image", part.image ? t("photo.change") : t("photo.choose"));
    shoot.onclick = thumb.shoot;
    choose.onclick = thumb.pick;
    thumb.buttons.push(shoot, choose);
    const picks = el("div", { className: "buttons" });
    picks.append(shoot, choose);
    c.append(picks);

    // Kick the picture off without awaiting it: the page must not wait on /media/.
    const gotPicture = (ok) => { if (ok) thumb.ph.hidden = true; };
    if (part.image) authImage(thumb.img, part.image).then(gotPicture);
    else pollImage(part.pk, thumb.img, gen).then(gotPicture);
  }

  // ---- the numbers, in one readable block ----
  const facts = el("div", { className: "facts" });
  const fact = (k, v) => {
    const d = el("div");
    d.append(el("span", { className: "k", textContent: k }),
           el("span", { className: "v", textContent: v }));
    facts.append(d);
  };
  const have = isRequirement ? Number(part.total_in_stock || 0) : Number(part.in_stock || 0);
  const target = Number(part.minimum_stock || 0);

  if (isRequirement) {
    fact(t("detail.kind"), t("detail.kindRequirement"));
  } else {
    const bn = part.variant_of ? ((PARTS.get(part.variant_of) || {}).full_name
                                || (PARTS.get(part.variant_of) || {}).name) : null;
    fact(t("field.requirement"), bn || t("detail.unassigned"));
  }

  const unit = unitsOf(part);
  fact(isRequirement ? t("detail.stockAllProducts") : t("detail.stockTotal"), fmtQty(have, unit));
  // For measured articles the pack content is the number everything else comes from — it
  // belongs where the stock is shown.
  if (unit && !isRequirement && packOf(part) != null) {
    fact(t("field.packContent"), fmtQty(packOf(part), unit));
  }
  // Only worth a line when a target was actually set — an article nobody stocks deliberately
  // should not be shown a deviation of zero against nothing.
  if (target) {
    fact(t("field.target"), fmtQty(target, unit));
    const diff = Math.round((have - target) * 1000) / 1000;
    const d = el("div");
    d.append(el("span", { className: "k", textContent: t("detail.deviation") }));
    const shown = (diff > 0 ? "+" : "") + fmtQty(diff, unit);
    d.append(el("span", {
    className: "v " + (diff < 0 ? "short" : "fine"),
    textContent: diff < 0 ? t("detail.deviationShort", { amount: shown }) : shown,
    }));
    facts.append(d);
  }
  fact(t("detail.batches"), fmtNum(items.length));
  // ONE location line. An earlier version showed both where the stock lies and what the
  // booking form would suggest — technically two different things, and a distinction nobody
  // asked for: it read as the overview contradicting the detail page. There is now one
  // "location", it means where the stuff is, and setting it moves the stock.
  const where = [...new Set(items.map((i) => locName(i.location)))];
  fact(t("field.location"), where.length ? where.join(", ")
               : (part.default_location ? locName(part.default_location) : "—"));
  if (part.default_expiry) {
    fact(t("detail.defaultExpiry"), t("days.count", { n: part.default_expiry }));
  }
  if ((part.description || "").trim() && part.description !== part.name) {
    fact(t("field.description"), part.description);
  }
  c.append(facts);
  host.append(c);

  /* A product that belongs to no requirement yet is the state a scan leaves behind, and it is
     the moment the answer is easiest: the name and the category are right there. Offered, not
     applied — a wrong guess silently written into the data would be worse than no guess. */
  if (!isRequirement && !part.variant_of) {
    const sug = suggestRequirements(part.name, part.category);
    const sim = similarProducts(part.name, part.pk);

    if (sug.length || sim.length) {
    const sc = el("div", { className: "card" });
    sc.append(el("h2", { className: "sec", textContent: t("suggest.heading") }));

    if (sug.length) {
      sc.append(el("div", {
        className: "hint",
        textContent: t("suggest.unassigned") + " " + t("suggest.pickOne"),
      }));
      const row = el("div", { className: "suggest" });
      for (const cand of sug) {
        const btn = el("button", {
          className: "btn", textContent: cand.t.full_name || cand.t.name,
        });
        btn.title = cand.why;
        btn.onclick = () => withBusy(btn, async () => {
          await api("/part/" + part.pk + "/", {
            method: "PATCH", body: { variant_of: cand.t.pk, minimum_stock: 0 },
          });
          PARTS.set(part.pk, Object.assign({}, part, { variant_of: cand.t.pk }));
          toast(t("suggest.assigned", { name: cand.t.full_name || cand.t.name }));
          showPart(part.pk);
        }, [...row.querySelectorAll("button")].filter((b) => b !== btn), true)
          .catch((e) => toast(e.message, true));
        row.append(btn);
      }
      sc.append(row);
    }

    if (sim.length) {
      sc.append(el("div", {
        className: "hint",
        textContent: (sug.length ? "" : t("suggest.unassigned") + " ")
                   + t("suggest.similar"),
      }));
      for (const cand of sim) {
        const row = el("button", { className: "btn ghost buyrow" });
        const who = el("div", { className: "grow" });
        who.append(el("div", { textContent: cand.p.full_name || cand.p.name }));
        who.append(el("div", {
          className: "meta",
          textContent: t("stock.have", { amount: fmtQty(Number(cand.p.in_stock || 0), unitsOf(cand.p)) })
                     + (cand.p.variant_of ? " · " + (requirementName(cand.p.pk) || "") : ""),
        }));
        row.append(who);
        const chev = el("div", { className: "chev" });
        chev.innerHTML = icon("chevron", 24);
        row.append(chev);
        row.onclick = () => openPart(cand.p.pk, "detail");
        sc.append(row);
      }
    }

    host.append(sc);
    }
  }

  // ---- every batch of this article, each with its own date ----
  const bc = el("div", { className: "card" });
  bc.append(el("h2", { className: "sec", textContent: t("detail.batches") }));
  const ul = el("ul", { className: "stock" });
  if (!items.length) {
    ul.append(el("li", { textContent: t("stock.emptyAll") }));
  }
  for (const it of items) {
    const li = el("li");
    li.append(el("div", { className: "qty", textContent: fmtQty(it.quantity, unitsOf(part)) }));
    li.append(el("div", { className: "meta", textContent: locName(it.location) }));
    // Panels anchor to the row, so a form always opens under what it edits.
    li.append(rowFoot(it,
    () => panelBatch(li, part, it, () => showPart(part.pk)),
    () => panelDelete(li, it, () => showPart(part.pk))));
    ul.append(li);
  }
  bc.append(ul);

  /* A requirement lists the products that serve it — and that is the ONLY place some of them can
     be reached: a variety you know but do not currently own has no stock row (so it is absent
     from the stock tab) and is not itself a requirement (so it is absent from the shopping list).
     Without this, buying a brand once and running out would make it disappear for good. */
  if (isRequirement) {
    const kids = [...PARTS.values()]
    .filter((x) => x.variant_of === part.pk)
    .sort((a, b) => byName(a.name, b.name));

    const kc = el("div", { className: "card" });
    kc.append(el("h2", { className: "sec", textContent: t("detail.varieties") }));

    if (!kids.length) {
    kc.append(el("div", { className: "hint", textContent: t("detail.noVarieties") }));
    }
    for (const k of kids) {
    const row = el("button", { className: "btn ghost buyrow" });

    const name = k.full_name || k.name;
    const mini = el("img", { className: "mini", alt: "", hidden: true });
    const miniPh = el("div", {
      className: "mini empty", textContent: (name[0] || "?").toUpperCase(),
    });
    row.append(mini, miniPh);
    // ⚠️ `thumbnail` is never empty — InvenTree substitutes its own blank graphic for a part
    // without a picture. `image` is the honest field, so it decides whether there is one.
    const src = k.image ? (k.thumbnail || k.image) : null;
    if (src) authImage(mini, src).then((ok) => { if (ok) miniPh.hidden = true; });

    const who = el("div", { className: "grow" });
    who.append(el("div", { textContent: name }));
    const have = Number(k.in_stock || 0);
    who.append(el("div", {
      className: "meta",
      textContent: have ? t("stock.have", { amount: fmtQty(have, unitsOf(k)) }) : t("stock.outOfStock"),
    }));
    row.append(who);
    const chev = el("div", { className: "chev" });
    chev.innerHTML = icon("chevron", 24);
    row.append(chev);
    row.onclick = () => openPart(k.pk, "detail");
    row.dataset.pk = String(k.pk);
    kc.append(row);
    }
    host.append(kc);
  }

  const acts = el("div", { className: "actions" });
  const bIn = labelButton("primary", "plus", t("action.bought"));
  const bOut = labelButton("", "minus", t("action.used"));
  const bCnt = labelButton("ghost", "check", t("action.counted"));
  bIn.onclick = () => panelBookIn(bc, part, items);
  bOut.onclick = () => panelAdjust(bc, part, items, "remove");
  bCnt.onclick = () => panelAdjust(bc, part, items, "count");
  acts.append(bIn, bOut, bCnt);
  bc.append(acts);
  host.append(bc);

  /* A product that was just discovered has no stock by definition, and the only reason to
     scan it then is to put it away — so that form opens unasked. NOT for a requirement: one
     never holds stock of its own, so the condition was true every single time and every
     requirement opened with a booking form over it. */
  if (!items.length && !isRequirement) panelBookIn(bc, part, items, true);
}

function panelBookIn(card, part, items, auto) {
  openPanel(card, (p) => {
    const u = unitsOf(part);
    const qty = qtySelect(null, 1);          // packets when measured, pieces when counted
    /* The crisis shelf first, always. Putting things away there is the normal case; the
     kitchen is the exception you pick deliberately. The part's own default and an existing
     batch's place are only fallbacks for a house that has no such shelf. */
    const preferred =
    (LOCATIONS.find((l) => l.pathstring === BOOK_LOCATION
                        || l.name === BOOK_LOCATION) || {}).pk
    || part.default_location || (items[0] && items[0].location)
    || (LOCATIONS.find((l) => l.name === DEFAULT_LOCATION) || {}).pk;
    const loc = locSelect(preferred);
    // Pre-filled from the part's own default_expiry, i.e. from the category table. The common
    // case is therefore "leave it", and correcting it is still one tap.
    const mhd = dateField(t("field.bestBefore"),
                        part.default_expiry ? isoInDays(part.default_expiry) : "");

    /* The content is its own field even when it is known. It is the number the whole
     measurement hangs on, and Open Food Facts is regularly wrong for bulk packs — this is where
     you correct it, at the moment you are holding the packet. */
    let content = null;
    if (u) {
    content = el("input", { type: "number", step: "0.001", min: "0" });
    const known = packOf(part);
    if (known != null) content.value = String(known);
    const sum = el("div", { className: "hint" });
    const recalc = () => {
      const c = Number(content.value);
      sum.textContent = c > 0
        ? fmtNum(qty.value) + " × " + fmtQty(c, u) + " = " + fmtQty(Number(qty.value) * c, u)
        : t("book.packQuestion");
    };
    qty.onchange = recalc;
    content.oninput = recalc;
    recalc();
    p.append(field(t("field.packets"), qty),
             field(t("field.packContent") + " (" + unitLabel(u) + ")", content), sum);
    } else {
    p.append(field(t("field.quantity"), qty));
    }
    p.append(field(t("field.location"), loc), mhd.wrap);
    panelButtons(p, t("book.confirm"), async () => {
    const perPack = u ? Number(content.value) : 0;
    if (u && !(perPack > 0)) throw new Error(t("book.packMissing"));
    const amount = u ? Number(qty.value) * perPack : Number(qty.value);
    const locPk = Number(loc.value);
    const want = mhd.input.value || null;
    // Only merge into an existing row when the date matches too. Adding a fresh jar to a
    // batch with a different MHD would quietly destroy the older date, which is the one
    // piece of information this whole app exists to keep.
    const same = items.find((i) => i.location === locPk
                  && (i.expiry_date || null) === want);
    if (same) {
      await api("/stock/add/", {
        method: "POST",
        body: { items: [{ pk: same.pk, quantity: amount }], notes: t("stock.note") },
      });
    } else {
      const body = { part: part.pk, quantity: amount, location: locPk };
      if (want) body.expiry_date = want;
      await api("/stock/", { method: "POST", body: body });
    }
    if (u) await savePack(part, perPack);
    toast(t("book.done", { amount: fmtQty(amount, u) }));
    /* The scan field still holds the barcode that got us here. Leaving it there means the
       next scan types into a field that already has something in it, and a mis-scan silently
       looks up the previous article again. Booked in = that barcode is dealt with. */
    const ean = $("#ean");
    if (ean) ean.value = "";
    showPart(part.pk);
    });
  }, auto);
}

function panelAdjust(card, part, items, kind) {
  if (!items.length) return toast(t("stock.none"), true);
  const counting = kind === "count";
  openPanel(card, (p) => {
    const pick = el("select");
    items.forEach((i, idx) => pick.append(el("option", {
    value: String(idx),
    textContent: fmtQty(i.quantity, unitsOf(part)) + " · " + locName(i.location)
               + (i.expiry_date ? " · " + fmtDate(i.expiry_date) : ""),
    })));

    // The quantity dropdown depends on which batch is selected (counting defaults to what is
    // recorded there), so it is rebuilt rather than merely re-valued.
    const qtyBox = el("div");
    const drawQty = () => {
    const it = items[Number(pick.value)];
    qtyBox.innerHTML = "";
    qtyBox.append(field(qtyLabel(part, counting ? t("count.actual") : t("field.quantity")),
                        qtyControl(part, it.quantity, counting ? it.quantity : 1)));
    };
    pick.onchange = drawQty;

    if (items.length > 1) p.append(field(t("field.batch"), pick));
    p.append(qtyBox);
    drawQty();

    panelButtons(p, counting ? t("count.confirm") : t("use.confirm"), async () => {
    const it = items[Number(pick.value)];
    // A select for counted articles, an input for measured ones — both carry .value.
    const qty = qtyBox.querySelector("select, input").value;
    await api("/stock/" + kind + "/", {
      method: "POST",
      body: { items: [{ pk: it.pk, quantity: qty }], notes: t("stock.note") },
    });
    const amount = fmtQty(qty, unitsOf(part));
    toast(counting ? t("count.done", { amount: amount }) : t("use.done", { amount: amount }));
    showPart(part.pk);
    });
  });
}

/* One batch, edited as a whole: how many are there, and until when do they keep. Splitting
   off part of it under a different date is the secondary path below. */
function panelBatch(host, part, item, after) {
  openPanel(host, (p) => {
    p.append(el("div", {
    className: "hint",
    textContent: fmtQty(item.quantity, unitsOf(part)) + " · " + locName(item.location),
    }));
    const qty = qtyControl(part, item.quantity, item.quantity);
    const loc = locSelect(item.location);
    const mhd = dateField(t("field.bestBefore"), item.expiry_date || "");
    p.append(field(qtyLabel(part, t("field.quantity")), qty), field(t("field.location"), loc), mhd.wrap);

    panelButtons(p, t("common.save"), async () => {
    if (Number(loc.value) !== Number(item.location)) {
      await api("/stock/transfer/", {
        method: "POST",
        body: {
          items: [{ pk: item.pk, quantity: item.quantity }],
          location: Number(loc.value),
          notes: t("stock.note"),
        },
      });
    }
    if (Number(qty.value) !== Number(item.quantity)) {
      await api("/stock/count/", {
        method: "POST",
        body: { items: [{ pk: item.pk, quantity: qty.value }], notes: t("stock.note") },
      });
    }
    if ((item.expiry_date || "") !== (mhd.input.value || "")) {
      await api("/stock/" + item.pk + "/", {
        method: "PATCH", body: { expiry_date: mhd.input.value || null },
      });
    }
    toast(t("common.saved"));
    after();
    });

    // Nothing to split off a single unit.
    if (Number(item.quantity) > 1) {
    const sp = el("button", { className: "btn ghost", textContent: t("split.open") });
    sp.style.marginTop = "8px";
    sp.onclick = () => panelSplit(host, part, item, after);
    p.append(sp);
    }
  });
}

/* Article-level edits: what it is, and where it lives.

   "location" here does the obvious thing rather than the technically precise one: it MOVES the
   stock (`/api/stock/transfer/`) and sets the article's default in the same breath, so the
   place shown is the place things are and the next booking lands there too. Splitting those
   into two fields was the earlier design and it only produced the question "what is the
   difference" — correctly, because for a pantry there is none worth carrying.

   Per-batch precision still exists in the batch editor, for the case where four jars really
   are in the cellar and two in the kitchen. */
function panelArticle(host, part, items) {
  openPanel(host, (p) => {
    /* The name is editable because the packet size lives in it — "Apfelmus (700 g)" is a
     guess at a shelf, and the day it turns out to be a 1-kg tub both the name and the target
     want correcting. Keeping that behind the admin UI would mean the list ossifies at
     whatever I assumed when I wrote it. */
    const name = el("input", { type: "text", value: part.name || "" });
    name.placeholder = t("field.name");

    const desc = el("input", { type: "text", value: part.description || "" });
    desc.placeholder = t("article.descPlaceholder");

    const unit = unitsOf(part);
    const targetInput = el("input", { type: "number",
                             value: Number(part.minimum_stock || 0) || "" });
    targetInput.min = "0";
    targetInput.step = unit ? "0.25" : "1";
    if (!unit) targetInput.inputMode = "numeric";
    targetInput.placeholder = t("article.targetPlaceholder");

    /* The unit belongs to the requirement, not the brand: measuring happens where the target
     is. Changing it here does NOT convert the stock — whoever turns pieces into kilograms has
     to recount the batches, which is exactly why the hint underneath says so. */
    let unitSel = null;
    if (part.is_template) {
    unitSel = unitSelect();
    unitSel.value = part.units || "";
    unitSel.onchange = () => { targetInput.step = unitSel.value ? "0.25" : "1"; };
    }

    /* The pack content belongs to the product: "one packet of rice" is 1 kg or 18 kg depending
     on the brand, and this number is what turns booking in into kilograms. */
    let packInput = null;
    if (unit && !part.is_template) {
    packInput = el("input", { type: "number", step: "0.001", min: "0" });
    const known = packOf(part);
    if (known != null) packInput.value = String(known);
    packInput.placeholder = t("article.packPlaceholder", { example: fmtNum(0.5) });
    }

    /* Which requirement this product serves. The whole point of the two levels: the target lives on
     the requirement, so two brands of pasta are short together or not at all. A requirement itself
     cannot be assigned to another one — one level of grouping is enough for a pantry and
     two would be a tree nobody maintains. */
    let reqSelect = null;
    if (!part.is_template) {
    reqSelect = el("select");
    reqSelect.append(el("option", { value: "", textContent: t("requirement.none") }));
    for (const tpl of [...PARTS.values()].filter((x) => x.is_template)
                       .sort((a, b) => byName(a.name, b.name))) {
      reqSelect.append(el("option", { value: String(tpl.pk),
                                   textContent: tpl.full_name || tpl.name }));
    }
    reqSelect.append(el("option", { value: "+", textContent: t("requirement.createOption") }));
    reqSelect.value = part.variant_of ? String(part.variant_of) : "";
    }

    const newName = el("input", { type: "text", value: "" });
    newName.placeholder = t("requirement.newNamePlaceholder");
    const newWrap = field(t("requirement.new"), newName);
    newWrap.hidden = true;
    if (reqSelect) {
    reqSelect.onchange = () => {
      newWrap.hidden = reqSelect.value !== "+";
      if (!newWrap.hidden && !newName.value) {
        /* A first guess, to be corrected rather than trusted. Everything in brackets is
           dropped first — that is where brands and marketing live ("Bio Rote Bete Saft
           (Nur Nur Natur)"), and taking the longest word without dropping it suggested
           "Natur)", punctuation and all. Of what remains, the longest word is usually the
           thing itself. */
        const guess = words(part.name).filter(strongWord);
        newName.value = guess.sort((a, b) => b.length - a.length)[0] || part.name || "";
      }
    };
    }

    const here = [...new Set(items.map((i) => i.location))];
    const loc = locSelect(here.length === 1 ? here[0] : part.default_location);
    if (here.length > 1) {
    loc.prepend(el("option", { value: "", textContent: t("article.keepLocations") }));
    loc.value = "";
    }

    const hint = (key) => p.append(el("div", { className: "hint", textContent: t(key) }));
    p.append(field(t("field.name"), name), field(t("field.description"), desc));
    if (reqSelect) { p.append(field(t("field.requirement"), reqSelect), newWrap); }
    if (unitSel) p.append(field(t("field.unit"), unitSel));
    p.append(field(unit ? t("field.targetOptionalUnit", { unit: unitLabel(unit) })
                      : t("field.targetOptional"), targetInput));
    if (packInput) p.append(field(t("field.packContent") + " (" + unitLabel(unit) + ")", packInput));
    if (unit) hint("article.quarterHint");
    p.append(field(t("field.location"), loc));
    if (unitSel) hint("article.unitHint");
    if (reqSelect) hint("article.requirementHint");
    if (here.length > 1) hint("article.movesAll");

    panelButtons(p, t("common.save"), async () => {
    const target = loc.value ? Number(loc.value) : null;

    // A new requirement is created first, so the product can be pointed at it in one save.
    let variantTarget;
    if (reqSelect) {
      if (reqSelect.value === "+") {
        const nm = newName.value.trim();
        if (!nm) throw new Error(t("requirement.nameMissing"));
        const created = await api("/part/", {
          method: "POST",
          body: {
            name: nm, description: t("requirement.description"), category: part.category,
            is_template: true, purchaseable: true, active: true,
            minimum_stock: Number(targetInput.value || 0),
          },
        });
        variantTarget = created.pk;
        PARTS.set(created.pk, created);
      } else {
        variantTarget = reqSelect.value ? Number(reqSelect.value) : null;
      }
    }

    if (!name.value.trim()) throw new Error(t("error.nameEmpty"));
    const patch = {
      name: name.value.trim(),
      description: desc.value,
      // Empty means "no target"; InvenTree stores that as 0, which is also what makes the
      // article drop out of low_stock and out of the Fehlt filter.
      minimum_stock: targetInput.value === "" ? 0
                   : (unitSel ? unitSel.value : unit) ? roundTarget(targetInput.value)
                   : Number(targetInput.value),
    };
    if (unitSel) patch.units = unitSel.value;
    if (target) patch.default_location = target;
    if (reqSelect) {
      patch.variant_of = variantTarget;
      // With a requirement in charge, a per-brand target would double-count: the requirement already
      // carries the number, and the brand would show up as short on its own.
      if (variantTarget) patch.minimum_stock = 0;
    }
    await api("/part/" + part.pk + "/", { method: "PATCH", body: patch });
    if (packInput && packInput.value !== "") await savePack(part, Number(packInput.value));

    const moving = items.filter((i) => i.location !== target);
    if (target && moving.length) {
      await api("/stock/transfer/", {
        method: "POST",
        body: {
          items: moving.map((i) => ({ pk: i.pk, quantity: i.quantity })),
          location: target,
          notes: t("stock.note"),
        },
      });
    }
    toast(t("common.saved"));
    showPart(part.pk);
    });
  });
}

/* Deleting a whole article, not just one batch.

   Two guards, because both failures are silent and expensive: a requirement with products under it
   would leave them orphaned and their stock uncounted, and a product with stock takes that
   stock with it. Neither is refused outright — the first is, because there is a correct order
   (unassign, then delete); the second is only warned about, because throwing away a mistyped
   article you never actually owned is legitimate. */
function panelDeletePart(host, part, items) {
  const kids = [...PARTS.values()].filter((x) => x.variant_of === part.pk);

  openPanel(host, (p) => {
    if (part.is_template && kids.length) {
    p.append(el("div", {
      className: "err",
      textContent: t("requirement.hasProducts", {
        n: kids.length, names: kids.map((k) => k.full_name || k.name).join(", "),
      }),
    }));
    const ok = el("button", { className: "btn ghost", textContent: t("common.understood") });
    ok.onclick = closePanel;
    const r = el("div", { className: "buttons" });
    r.append(ok);
    p.append(r);
    return;
    }

    const total = items.reduce((n, i) => n + Number(i.quantity), 0);
    p.append(el("div", {
    className: "hint",
    textContent: t(part.is_template ? "delete.requirement" : "delete.article", { name: part.name })
               + (total ? " " + t("delete.stockLost", { amount: fmtQty(total, unitsOf(part)) }) : "")
               + " " + t("delete.irreversible"),
    }));
    panelButtons(p, t("delete.confirm"), async () => {
    for (const it of items) await api("/stock/" + it.pk + "/", { method: "DELETE" });
    // InvenTree refuses to delete an active part, so it is retired first.
    await api("/part/" + part.pk + "/", { method: "PATCH", body: { active: false } });
    await api("/part/" + part.pk + "/", { method: "DELETE" });
    toast(t("delete.done"));
    PARTS.delete(part.pk);
    LOW_STOCK.delete(part.pk);
    // Deleted means there is no way back to this page, not even through the stack.
    DETAIL_STACK.length = 0;
    DETAIL_PK = null;
    showTab(DETAIL_FROM);
    }, true);
  });
}

/* Deleting removes the row outright — it is not "verbraucht", which books a transaction and
   keeps the history. Both exist on purpose: use-up is the normal path, delete is for a row
   that should never have been there. It asks first, in the same panel every other action
   uses, rather than through window.confirm — that is the browser dialog this app spent a
   version getting rid of. */
function panelDelete(host, item, after) {
  openPanel(host, (p) => {
    p.append(el("div", {
    className: "hint",
    textContent: t(item.expiry_date ? "delete.batchDated" : "delete.batch", {
      what: fmtQty(item.quantity, unitsOf(PARTS.get(item.part))) + " · " + locName(item.location),
      date: fmtDate(item.expiry_date),
    }) + " " + t("delete.irreversible"),
    }));
    panelButtons(p, t("delete.confirm"), async () => {
    await api("/stock/" + item.pk + "/", { method: "DELETE" });
    toast(t("delete.batchDone"));
    after();
    }, true);
  });
}

/* Six jars bought on two days are two batches with two dates, and until now the app could only
   hold one date per row — which is exactly the case the user ran into.

   InvenTree has NO split endpoint (checked against the live schema: merge, serialize, convert
   and install exist, split does not), so this is two calls. The ORDER is the entire safety
   argument: create the new batch FIRST, then take the amount off the old one. If the second
   call fails you are holding too much, which is visible on the card and one correction away.
   Doing it the other way round loses stock with nothing left to show for it. */
function panelSplit(host, part, item, after) {
  openPanel(host, (p) => {
    const max = Number(item.quantity);
    p.append(el("div", {
    className: "hint",
    textContent: t(item.expiry_date ? "split.fromDated" : "split.from", {
      what: fmtQty(item.quantity, unitsOf(part)) + " · " + locName(item.location),
      date: fmtDate(item.expiry_date),
    }),
    }));

    const u = unitsOf(part);
    let qty;
    if (u) {
    qty = el("input", { type: "number", step: "0.01", min: "0", max: String(max) });
    qty.value = String(Math.round(max * 50) / 100);   // half, as the obvious suggestion
    } else {
    qty = el("select");
    for (let i = 1; i < max; i++) {
      qty.append(el("option", { value: String(i), textContent: fmtNum(i) }));
    }
    qty.value = "1";
    }

    const mhd = dateField(
    t("split.newDate"),
    part.default_expiry ? isoInDays(part.default_expiry) : (item.expiry_date || ""));
    p.append(field(u ? t("split.howMuchUnit", { unit: unitLabel(u) }) : t("split.howMany"), qty),
           mhd.wrap);

    panelButtons(p, t("split.confirm"), async () => {
    const n = qty.value;
    const body = { part: item.part, quantity: n, location: item.location };
    if (mhd.input.value) body.expiry_date = mhd.input.value;
    await api("/stock/", { method: "POST", body: body });
    await api("/stock/remove/", {
      method: "POST",
      body: { items: [{ pk: item.pk, quantity: n }], notes: t("split.note") },
    });
    toast(t("split.done", { amount: fmtQty(n, u) }));
    after();
    });
  });
}

// --- camera ------------------------------------------------------------------
let stream = null, scanning = false;

/* Stopping is its own function and gets called from every way out of the tab. A camera that
   keeps running behind another page is a light that stays on in someone's kitchen. */
function stopCam() {
  if (stream) {
    stream.getTracks().forEach((track) => track.stop());
    stream = null;
    scanning = false;
    const v = $("#cam");
    if (v) { v.hidden = true; v.srcObject = null; }
  }
  updateCamBtn();
}

/* The camera button only exists for the case where the camera did NOT come up: permission
   refused, or another app holding the device. In the normal flow it is redundant since the
   scanner starts by itself — and worse than redundant, because a control still labelled
   "camera" would then be switching the running camera off.

   Hidden outright where there is no barcode detector: switching on a camera that cannot read
   anything is not a retry, it is a light. "No detector" is only known once loadScanner() has
   tried, which the scan tab does by itself on opening. */
function updateCamBtn() {
  const btn = $("#camBtn");
  if (!btn) return;
  const possible = !scannerMissing;
  btn.hidden = !!stream || !possible;
  // The row is a two-column grid; with one button gone the other should take the width
  // rather than leave a hole.
  const row = btn.parentElement;
  if (row) row.classList.toggle("solo", btn.hidden);
}

/* BarcodeDetector is native in Chrome on Android, and missing in Safari, so on every iPhone
   browser (they are all WebKit), and in desktop Chromium on Linux. Nothing is fetched from a
   CDN: this page is often served from an internal host that cannot reach one. Instead,
   tools/fetch-scanner.sh can put a polyfill into vendor/ (ZXing-C++ compiled to WebAssembly,
   the barcode-detector package, pinned by checksum), and it is loaded from this origin, the
   first time the scanner is needed and only where no native detector exists, so a phone that
   has one never downloads it. Without those files nothing changes: typing an EAN is the
   fallback, as before. */
let scannerLoad = null;
let scannerMissing = false;
function loadScanner() {
  if ("BarcodeDetector" in window) return Promise.resolve(true);
  if (!scannerLoad) {
    scannerLoad = new Promise((resolve) => {
      const s = document.createElement("script");
      s.src = "vendor/barcode-detector.js";
      s.onload = () => {
        const api = window.BarcodeDetectionAPI;
        // A missing file can still "load": the web server's catch-all answers with
        // index.html (deploy/Caddyfile.snippet's try_files), which runs as a syntax error.
        if (!("BarcodeDetector" in window) || !api || !api.prepareZXingModule) {
          resolve(false);
          return;
        }
        // The polyfill fetches its .wasm from jsDelivr unless told otherwise.
        api.prepareZXingModule({
          overrides: {
            locateFile: (path, prefix) =>
              path.endsWith(".wasm") ? new URL("vendor/" + path, document.baseURI).href : prefix + path,
          },
        });
        resolve(true);
      };
      s.onerror = () => resolve(false);
      document.head.appendChild(s);
    });
  }
  return scannerLoad;
}

async function startCam() {
  if (stream) return;
  const haveDetector = await loadScanner();
  scannerMissing = !haveDetector;
  // The first load takes a moment on a phone; whoever left the scan screen meanwhile must
  // not come back to a camera that switched itself on behind another tab.
  if ($("#view-scan").hidden) return;
  if (!haveDetector) {
    $("#camHint").hidden = false;
    $("#camHint").textContent = t("scan.noDetector");
    updateCamBtn();
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" }, audio: false,
    });
  } catch (e) {
    $("#camHint").hidden = false;
    $("#camHint").textContent = t("scan.cameraDenied", { error: e.message });
    updateCamBtn();
    return;
  }
  const v = $("#cam");
  v.hidden = false; v.srcObject = stream; await v.play();
  updateCamBtn();

  const det = new window.BarcodeDetector({
    formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "qr_code"],
  });
  scanning = true;
  const tick = async () => {
    if (!scanning) return;
    try {
    const codes = await det.detect(v);
    if (codes.length) {
      const code = codes[0].rawValue;
      $("#ean").value = code;
      stopCam();
      lookup(code);
      return;
    }
    } catch (e) { /* a dropped frame is not an error worth surfacing */ }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// --- stocktake ---------------------------------------------------------------
/* Everything, filtered by tapping — not a location you must pick before seeing anything.
   The rows are fetched once and filtered in the browser: a household inventory is a few
   hundred rows, so a refetch per chip would be latency spent on nothing. */
let STOCK_ALL = [];
let STOCK_FILTER = null;   // null = alle; otherwise a location pathstring
let STOCK_QUERY = "";      // free-text search, matched against name, description and place
let STOCK_SHORT = false;   // only articles under their target
/* pk -> the Part row, for everything the server considers under target. Fetched separately
   and not derived from the stock rows, because the interesting case is an article that is
   MISSING ENTIRELY: it has no stock row at all, so it cannot appear in a list built from
   stock. `low_stock=true` is InvenTree's own comparison of total stock against the article's
   minimum_stock, which is what this app calls the target. */
let LOW_STOCK = new Map();
/* pk -> Part, for every article. Needed because the nested `part_detail` on a stock row is a
   PartBrief, and PartBrief does NOT carry `variant_of` — so without this the overview cannot
   tell which requirement a product belongs to. One extra request for the whole catalogue, which in
   a household is a few dozen rows. */
let PARTS = new Map();

const requirementOf = (pk) => (PARTS.get(pk) || {}).variant_of || null;
const requirementName = (pk) => {
  const tpl = PARTS.get(requirementOf(pk));
  return tpl ? (tpl.full_name || tpl.name) : null;
};

const targetOf = (pd) => Number((pd || {}).minimum_stock || 0);

/* Matching is by pathstring PREFIX, which is what makes "Keller" also cover
   "Keller/Krisenvorrat" — the same thing the API's cascade=true used to do for us, minus the
   round trip. The separator check stops "Keller" from also swallowing a "Kellerregal". */
function matchesPlace(path, place) {
  const f = place === undefined ? STOCK_FILTER : place;
  if (!f) return true;
  return path === f || path.startsWith(f + "/");
}

function matchesQuery(pd, path, query) {
  const q = query === undefined ? STOCK_QUERY : query;
  if (!q) return true;
  // Name, description and place all count: on a phone you search for "tomaten", for "bio"
  // (which the OFF plugin writes into keywords and often the description) or for "keller".
  const hay = [(pd || {}).full_name, (pd || {}).name, (pd || {}).description, (pd || {}).IPN,
             path].filter(Boolean).join(" ").toLowerCase();
  return hay.includes(q);
}

function inFilter(item) {
  const path = locName(item.location);
  return matchesPlace(path) && matchesQuery(item.part_detail, path);
}

/* One entry per ARTICLE: its batches, its totals, and whether it is under target. Articles
   that are missing entirely come in from LOW_STOCK with no batches at all — without them
   "Fehlbestand" would list everything except the things you have actually run out of. */
/* `over` lets a caller ask the same question with different filters — the shopping list wants
   "everything under target, everywhere", regardless of what the stock tab happens to be
   filtered to. Omitted, it uses the stock tab's current filters. */
function articleEntries(over) {
  const o = over || {};
  const wantShort = "short" in o ? o.short : STOCK_SHORT;
  const wantPlace = "place" in o ? o.place : STOCK_FILTER;
  const wantQuery = "query" in o ? o.query : STOCK_QUERY;
  const byPart = new Map();

  for (const it of STOCK_ALL) {
    if (!byPart.has(it.part)) byPart.set(it.part, []);
    byPart.get(it.part).push(it);
  }

  const entries = [];

  for (const [pk, batches] of byPart) {
    const pd = batches[0].part_detail || {};
    const total = batches.reduce((n, i) => n + Number(i.quantity), 0);
    const target = targetOf(pd);
    // A shortfall belongs to the requirement, not to the brand: two kinds of pasta under one
    // "Nudeln" are short together or not at all, and the number that matters is the requirement's.
    const tpl = LOW_STOCK.get(requirementOf(pk));
    const own = target ? Math.max(0, target - total) : 0;
    entries.push({
    pk: pk, pd: pd, batches: batches, total: total, target: target,
    places: [...new Set(batches.map((i) => locName(i.location)))],
    requirement: requirementName(pk),
    missing: own || (tpl ? Math.max(0, targetOf(tpl) - Number(tpl.total_in_stock || 0)) : 0),
    first: batches[0].expiry_date || "9999-12-31",
    });
  }


  return entries
    .filter((e) => {
    if (wantShort && !e.missing) return false;
    if (wantPlace && !e.places.some((pl) => matchesPlace(pl, wantPlace))) return false;
    if (wantQuery && !matchesQuery(e.pd, e.places.join(" "), wantQuery)) return false;
    return true;
    })
    .sort((a, b) => {
    // Shortfalls first — if you opened the list to see what is missing, that is the answer.
    if (!!b.missing !== !!a.missing) return b.missing ? 1 : -1;
    return a.first < b.first ? -1 : a.first > b.first ? 1 : 0;
    });
}

function drawChips() {
  const sel = $("#locsel");
  const btn = $("#shortbtn");

  const counts = new Map();
  // Counted over the TEXT-filtered set but not the location-filtered one: the numbers should
  // say "how many of what you searched for are here", while staying comparable between
  // entries. Using STOCK_ALL would make them contradict the list you are looking at.
  const base = STOCK_ALL.filter((i) => matchesQuery(i.part_detail, locName(i.location)));

  for (const it of base) {
    // A row counts towards its own location and every ancestor, so the numbers add up the way
    // the tree reads rather than the way the rows are stored.
    const parts = locName(it.location).split("/");
    for (let i = 1; i <= parts.length; i++) {
    const key = parts.slice(0, i).join("/");
    counts.set(key, (counts.get(key) || 0) + 1);
    }
  }

  sel.innerHTML = "";
  sel.append(el("option", { value: "", textContent: t("stock.allLocations", { n: base.length }) }));
  // Only places that actually hold something: an empty shelf is an option you never want.
  for (const l of LOCATIONS) {
    const n = counts.get(l.pathstring) || 0;
    if (n) {
    sel.append(el("option", {
      value: l.pathstring, textContent: l.pathstring + " (" + n + ")",
    }));
    }
  }
  // A place that no longer holds anything drops out of the list, so the filter drops with it.
  if (STOCK_FILTER && ![...sel.options].some((o) => o.value === STOCK_FILTER)) {
    STOCK_FILTER = null;
  }
  sel.value = STOCK_FILTER || "";
  sel.onchange = () => { STOCK_FILTER = sel.value || null; drawStocktake(); };

  const short = articleEntriesShortCount();
  btn.innerHTML = "";
  const ic = el("span", { className: "ic" });
  ic.innerHTML = icon("alert", 18);
  btn.append(ic, el("span", { textContent: t("stock.missingToggle") }),
           el("span", { className: "n", textContent: fmtNum(short) }));
  btn.setAttribute("aria-pressed", String(STOCK_SHORT));
  btn.disabled = !short && !STOCK_SHORT;
  btn.style.opacity = btn.disabled ? "0.45" : "";
  btn.title = STOCK_SHORT ? t("stock.showAll") : t("stock.showShort");
  btn.onclick = () => { STOCK_SHORT = !STOCK_SHORT; drawChips(); drawStocktake(); };
}

/* The count for the "Fehlt" toggle, taken without the shortfall filter itself applied —
   otherwise the number would only ever be the number you are already looking at. */
function articleEntriesShortCount() {
  return articleEntries({ short: false }).filter((e) => e.missing).length;
}

/* The shopping list is not derived from stock rows but from what the SERVER considers under
   target — which is the only source that gets requirements right: a template holds no stock of its
   own, its variants do, and `total_in_stock` is InvenTree's own sum over them. Building this
   from stock rows would list brands, and miss anything that has run out entirely. */
function shoppingEntries() {
  const out = [];
  for (const part of LOW_STOCK.values()) {
    const have = Number(part.total_in_stock ?? part.in_stock ?? 0);
    const target = targetOf(part);
    if (!target || have >= target) continue;
    out.push({
    pk: part.pk, pd: part, total: have, target: target, missing: target - have,
    template: !!part.is_template,
    places: [...new Set(STOCK_ALL
      .filter((i) => i.part === part.pk || requirementOf(i.part) === part.pk)
      .map((i) => locName(i.location)))],
    });
  }
  return out.sort((a, b) => byName(a.pd.name, b.pd.name));
}

// "12 articles" and "3 batches", counted with the language's plural rules.
const nArticles = (n) => t("count.articles", { n: n });

function drawStocktake() {
  closePanel();
  const entries = articleEntries();
  const box = $("#stocklist");
  box.innerHTML = "";

  if (!entries.length) {
    box.append(hintCard(!STOCK_ALL.length && !LOW_STOCK.size ? t("stock.emptyAll")
    : STOCK_SHORT ? t("stock.nothingMissing")
    : STOCK_QUERY ? t("common.noResults") : t("stock.emptyHere")));
    return;
  }

  /* The one heading that used to be a plain count line. It follows the same shape as every other
     section: a noun for what the box holds, then what narrows it after a middle dot.

     The selected place is deliberately NOT in here, although it narrows the list too. Location
     names are free text, and "Krisenvorrat" already wrapped this heading onto a second line at
     360 px — in 12 px letter-spaced capitals that reads like a mistake. The select right above the
     list names the place anyway. */
  const batchCount = entries.reduce((n, e) => n + e.batches.length, 0);
  const c = el("div", { className: "card" });
  c.append(el("h2", {
    className: "sec",
    textContent: (STOCK_SHORT ? t("stock.headingShort") : t("stock.heading"))
             + " · " + nArticles(entries.length)
             + (batchCount > entries.length ? " · " + t("count.batches", { n: batchCount }) : ""),
  }));
  const ul = el("ul", { className: "stock" });

  for (const e of entries) {
    const name = e.pd.full_name || t("article.fallbackName", { pk: e.pk });
    const li = el("li");
    const row = el("button", { className: "btn ghost rowlink" });
    row.title = t("article.open");

    row.append.apply(row, miniThumb(e.pd, name));

    const who = el("div", { className: "who" });
    who.append(el("div", { className: "nm", textContent: name }));
    who.append(el("div", {
    className: "meta",
    textContent: (e.target ? t("stock.haveOfTarget", {
                  have: fmtQty(e.total, unitsOf(e.pd)), target: fmtQty(e.target, unitsOf(e.pd)),
                }) : fmtQty(e.total, unitsOf(e.pd)))
               + (e.requirement ? " · " + e.requirement : "")
               + (e.places.length ? " · " + (e.places.length === 1 ? e.places[0]
                                             : t("count.places", { n: e.places.length })) : ""),
    }));

    const dates = el("div", { className: "dates" });
    if (e.missing) {
    dates.append(el("span", { className: "pill bad",
                              textContent: t("stock.missingAmount", { amount: fmtQty(e.missing, unitsOf(e.pd)) }) }));
    }
    if (e.batches.length) {
    dates.append(expiryPill(e.batches[0].expiry_date));
    if (e.batches.length > 1) {
      dates.append(el("span", {
        className: "pill", textContent: t("stock.moreBatches", { n: e.batches.length - 1 }),
      }));
    }
    } else {
    dates.append(el("span", { className: "pill", textContent: t("stock.noStock") }));
    }
    who.append(dates);
    row.append(who);

    const chev = el("div", { className: "chev" });
    chev.innerHTML = icon("chevron", 24);
    row.append(chev);

    row.onclick = () => openPart(e.pk, "stock");
    row.dataset.pk = String(e.pk);
    li.append(row);
    ul.append(li);
  }

  c.append(ul);
  box.append(c);
  focusLastRow(box);
}

/* Draw from what we already have, then refresh in the background.

   Every tab switch and every "back" used to throw the list away and wait ~180 ms for the
   same rows to come back, with a "loading" flash in between. That wait is what made the app
   feel slow — not the rendering, and not the server, which answers in 25-90 ms. Now the list
   is on screen instantly and quietly corrects itself a moment later. A cold start still shows
   the loading line, because then there genuinely is nothing to show. */
async function renderStocktake(force) {
  closePanel();
  const cold = !STOCK_ALL.length && !LOW_STOCK.size;

  if (cold) { $("#stocklist").innerHTML = ""; $("#stocklist").append(hintCard(t("common.loading"))); }
  else { drawChips(); drawStocktake(); }

  if (!cold && force === false) return;

  try {
    await loadStockData();
  } catch (e) {
    if (cold) { $("#stocklist").innerHTML = ""; $("#stocklist").append(hintCard(e.message, "card err")); }
    return;
  }

  drawChips();
  drawStocktake();
  drawTabs();
  LAST_OPENED = null;        // the final draw has happened; stop chasing the row
}

/* The one fetch both list views are built from. Neither endpoint needs the other, so they go
   together; `low_stock` is what supplies articles that have run out completely and therefore
   own no stock row at all. */
async function loadStockData() {
  const [data, low, parts, params, tpls] = await Promise.all([
    api("/stock/?in_stock=true&part_detail=true&limit=500"),
    api("/part/?low_stock=true&limit=500"),
    api("/part/?limit=500"),
    // Pack contents in ONE request instead of one per product. If it fails the app keeps
    // counting packets — imprecise, but not broken.
    api("/parameter/?limit=1000", { quiet: true }).catch(() => null),
    api("/parameter/template/?limit=100", { quiet: true }).catch(() => null),
  ]);

  STOCK_ALL = (data.results || data || []).slice()
    .sort((a, b) => ((a.expiry_date || "9999") < (b.expiry_date || "9999") ? -1 : 1));

  LOW_STOCK = new Map();
  for (const part of (low.results || low || [])) LOW_STOCK.set(part.pk, part);

  PARTS = new Map();
  for (const part of (parts.results || parts || [])) PARTS.set(part.pk, part);

  PACK_TPL = null;
  for (const tpl of ((tpls && (tpls.results || tpls)) || [])) {
    if (tpl.name === PACK_NAME) PACK_TPL = tpl.pk;
  }
  PACK.clear();
  PACK_PARAM.clear();
  for (const prm of ((params && (params.results || params)) || [])) {
    if (!PACK_TPL || prm.template !== PACK_TPL) continue;
    // `data_numeric` is InvenTree's own parse; `data` is the raw text and only the fallback.
    const v = Number(prm.data_numeric != null ? prm.data_numeric : prm.data);
    if (isFinite(v) && v > 0) { PACK.set(prm.model_id, v); PACK_PARAM.set(prm.model_id, prm.pk); }
  }

  // A filter pointing at a location that no longer holds anything would show an empty list
  // with no hint why, so it falls back to showing everything.
  if (STOCK_FILTER && !STOCK_ALL.some(inFilter)) STOCK_FILTER = null;
}

// ---------------- shopping list ----------------------------------------------
async function renderBuy() {
  const cold = !STOCK_ALL.length && !LOW_STOCK.size;
  if (cold) { $("#buylist").innerHTML = ""; $("#buylist").append(hintCard(t("common.loading"), "hint")); }
  else drawBuy();

  try { await loadStockData(); } catch (e) {
    if (cold) { $("#buylist").innerHTML = ""; $("#buylist").append(hintCard(e.message, "err")); }
    return;
  }
  drawBuy();
  drawTabs();
  LAST_OPENED = null;        // the final draw has happened; stop chasing the row
}

/* The list as plain text. Plain text on purpose: it is the one format every target
   understands — a messenger, a notes app, a mail, the clipboard — and it stays readable if it
   ends up somewhere none of us thought of. */
function buyText(entries) {
  const lines = [t("buy.textTitle", { date: fmtDate(new Date()) }), ""];
  for (const e of entries) {
    const u = unitsOf(e.pd);
    lines.push(t("buy.textLine", {
    name: e.pd.full_name || t("article.fallbackName", { pk: e.pk }),
    missing: fmtQty(e.missing, u), have: fmtQty(e.total, u), target: fmtQty(e.target, u),
    }));
  }
  return lines.join("\n");
}

/* Share first, clipboard second.

   `navigator.share` hands the text to Android's own share sheet, which means the list can go
   to Telegram, a notes app, a mail or anything else installed — without this app having to
   pick a service, hold a token for it, or be changed when the choice changes. Where the API
   is missing (desktop browsers, mostly) the text goes to the clipboard instead, which is the
   same thing minus the menu. */
async function shareList(text) {
  if (navigator.share) {
    try {
    await navigator.share({ title: t("buy.heading"), text: text });
    return;
    } catch (e) {
    if (e && e.name === "AbortError") return;   // the user closed the sheet; not a failure
    }
  }
  await copyList(text);
}

async function copyList(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast(t("buy.copied"));
  } catch (e) {
    toast(t("buy.copyFailed", { error: e.message }), true);
  }
}

/* Every requirement, whether short or not — the list has to be reachable to be maintainable. A
   satisfied requirement appears nowhere else: it holds no stock, so it is not in the stock tab, and
   it is not short, so it is not on the shopping list. Without this view the 80 entries would
   be frozen at whatever they were imported as. */
function allRequirements() {
  const out = [];
  for (const part of PARTS.values()) {
    if (!part.is_template) continue;
    const have = Number(part.total_in_stock ?? 0);
    const target = targetOf(part);
    out.push({
    pk: part.pk, pd: part, total: have, target: target,
    missing: target ? Math.max(0, target - have) : 0, template: true,
    places: [...new Set(STOCK_ALL
      .filter((i) => requirementOf(i.part) === part.pk)
      .map((i) => locName(i.location)))],
    });
  }
  return out.sort((a, b) => byName(a.pd.name, b.pd.name));
}

let BUY_ALL = false;
let BUY_QUERY = "";

/* Matches against name and description only — a requirement has no place of its own, and the
   places its products happen to sit would make "Keller" match half the list for no reason the
   user could see. */
function buyMatch(e) {
  if (!BUY_QUERY) return true;
  const pd = e.pd || {};
  return [pd.full_name, pd.name, pd.description]
    .filter(Boolean).join(" ").toLowerCase().includes(BUY_QUERY);
}

function drawBuy() {
  const box = $("#buylist");
  const missing = shoppingEntries().filter(buyMatch);
  const entries = (BUY_ALL ? allRequirements() : shoppingEntries()).filter(buyMatch);

  // Share what is on screen. Filtering to three entries and then sending eighty would be a
  // surprise; the count on the button says plainly what is about to go out.
  drawFab(missing);

  const controls = $("#buycontrols");
  controls.innerHTML = "";
  const tog = labelButton("ghost", BUY_ALL ? "cart" : "list",
                        BUY_ALL ? t("buy.onlyMissing") : t("buy.allRequirements"));
  tog.onclick = () => { BUY_ALL = !BUY_ALL; drawBuy(); };
  const neu = labelButton("ghost", "plus", t("requirement.new"));
  neu.onclick = () => { DETAIL_FROM = "buy"; showTab("new"); };
  controls.append(tog, neu);

  box.innerHTML = "";
  box.append(el("h2", {
    className: "sec",
    textContent: (BUY_ALL ? t("buy.allRequirements") : t("buy.heading"))
             + (BUY_QUERY ? " · " + t("count.hits", { n: entries.length }) : ""),
  }));

  if (!entries.length) {
    box.append(el("div", {
    className: "hint",
    textContent: BUY_QUERY ? t("common.noResults")
      : BUY_ALL ? t("buy.noRequirements")
      : t("buy.complete"),
    }));
    return;
  }

  for (const e of entries) {
    const row = el("button", { className: "btn ghost buyrow" });
    row.title = t("requirement.open");
    const who = el("div", { className: "grow" });
    who.append(el("div", { textContent: e.pd.full_name || t("article.fallbackName", { pk: e.pk }) }));
    who.append(el("div", {
    className: "meta",
    textContent: (e.target ? t("buy.haveOfTarget", {
                                have: fmtQty(e.total, unitsOf(e.pd)),
                                target: fmtQty(e.target, unitsOf(e.pd)),
                              })
                            : t("buy.noTarget"))
               + (e.places.length ? " · " + e.places.join(", ") : ""),
    }));
    row.append(who);
    row.append(el("div", {
    className: e.missing ? "need" : "meta",
    textContent: e.missing ? "+" + fmtQty(e.missing, unitsOf(e.pd)) : t("buy.ok"),
    }));
    row.onclick = () => openPart(e.pk, "buy");
    row.dataset.pk = String(e.pk);
    box.append(row);
  }
  focusLastRow(box);

}

/* One floating button, showing what THIS device can actually do.

   On a phone "copy" is all but redundant: Android's own share sheet offers copying to the
   clipboard among everything else, so a second button would spend a permanent piece of the
   screen on a duplicate. Where the Web Share API is missing — desktop browsers, mostly — the
   same button copies instead. One control, always the right one.

   Sharing always sends the SHORTFALLS, never the full catalogue: nobody takes eighty lines to
   the shop, and the "all requirements" toggle is about editing, not about what you buy. */
function drawFab(entries) {
  const fab = $("#fab");

  if (!entries || !entries.length) {
    fab.hidden = true;
    return;
  }

  const canShare = typeof navigator !== "undefined" && !!navigator.share;
  fab.innerHTML = "";
  const ic = el("span", { className: "ic" });
  ic.innerHTML = icon(canShare ? "share" : "copy", 20);
  fab.append(ic, el("span", {
    // The count appears only while a search narrows the list — otherwise it would just repeat
    // the badge on the tab.
    textContent: (canShare ? t("buy.share") : t("buy.copy"))
             + (BUY_QUERY ? " (" + fmtNum(entries.length) + ")" : ""),
  }));
  fab.onclick = () => (canShare ? shareList : copyList)(buyText(entries));
  fab.hidden = false;
}

/* Which tab the detail or new page was opened from, so "back" returns there instead of
   guessing. */
let DETAIL_FROM = "stock";

function showTab(which) {
  $("#view-scan").hidden = which !== "scan";
  $("#view-stock").hidden = which !== "stock";
  $("#view-buy").hidden = which !== "buy";
  $("#view-expiry").hidden = which !== "expiry";
  $("#view-detail").hidden = which !== "detail";
  $("#view-new").hidden = which !== "new";

  // While a detail or new page is open the tab it was reached from stays marked: those are
  // pages *within* a tab, not further destinations.
  const marked = (which === "detail" || which === "new") ? DETAIL_FROM : which;
  for (const [id] of TABS) {
    $("#tab-" + id).setAttribute("aria-selected", String(marked === id));
  }

  // Hidden first: leaving it up while another tab renders would offer an action that does not
  // belong to what is on screen.
  $("#fab").hidden = true;
  /* The scanner is what the tab is FOR, so it starts by itself instead of behind a button —
     and stops the moment you leave, including on the way to an article you just scanned. */
  if (which === "scan") startCam(); else stopCam();
  if (which === "stock") renderStocktake();
  if (which === "buy") renderBuy();
  if (which === "expiry") renderExpiry();
  if (which === "new") drawNewRequirement();
  // Not when a row is waiting to be brought back into view — that would scroll to the top and
  // then jump, which looks broken and loses the place you were working in.
  if (!LAST_OPENED) window.scrollTo(0, 0);
  saveView(which);
}

/* Where the user was, so a reload puts them back. sessionStorage, not localStorage: opening
   the app tomorrow should start at the stock list, but pressing reload on a requirement you were
   editing should not throw the page away. */
const VIEW_KEY = "vorrat.view";

function saveView(which, pk) {
  try {
    sessionStorage.setItem(VIEW_KEY, JSON.stringify({
    view: which, pk: pk || null, from: DETAIL_FROM,
    }));
  } catch (e) { /* private mode; the app just forgets */ }
}

async function restoreView() {
  let v = null;
  try { v = JSON.parse(sessionStorage.getItem(VIEW_KEY) || "null"); } catch (e) { v = null; }
  if (!v) return false;

  if (v.view === "detail" && v.pk) {
    DETAIL_FROM = v.from === "buy" ? "buy" : "stock";
    showTab(DETAIL_FROM);            // the list has to exist behind the page
    // After a reload there is no way back to spend: history starts afresh here, so no entry
    // is created either.
    try { await openPart(v.pk, DETAIL_FROM, { noHistory: true }); return true; }
    catch (e) { return false; }
  }
  if (["stock", "buy", "expiry", "scan", "new"].indexOf(v.view) >= 0) {
    if (v.view === "new") DETAIL_FROM = v.from === "buy" ? "buy" : "stock";
    showTab(v.view);
    return true;
  }
  return false;
}

/* The row the user last opened, so returning to a list lands on it instead of at the top.
   Working through a shopping list means going down it; scrolling back to position 40 after
   every entry is the kind of friction that makes people stop using a thing. */
let LAST_OPENED = null;

/* Deliberately does NOT clear LAST_OPENED: a list is drawn twice on the way back — once from
   the cache so it appears instantly, once after the refresh — and the second pass rebuilds
   the DOM. Clearing on the first pass meant the scroll was undone a moment later by a redraw
   that no longer knew where to look. The callers clear it once they are done drawing. */
function focusLastRow(box) {
  if (!LAST_OPENED) return;
  const row = box.querySelector('[data-pk="' + LAST_OPENED + '"]');
  if (!row) return;
  // After layout, or the row's position is still the one it had before this redraw.
  requestAnimationFrame(() => {
    row.scrollIntoView({ block: "center" });
    row.classList.add("justleft");
    setTimeout(() => row.classList.remove("justleft"), 1800);
  });
}

/* Creating a requirement is a page, not a panel: it is a form you arrive at deliberately, and on a
   phone a panel under eighty rows puts the fields somewhere you have to hunt for. */
function drawNewRequirement() {
  const back = $("#newback");
  back.innerHTML = "";
  const bi = el("span", { className: "ic" });
  bi.innerHTML = icon("back");
  back.append(bi, el("span", { textContent: t("nav.back") }));
  back.onclick = () => showTab(DETAIL_FROM);

  const box = $("#newform");
  box.innerHTML = "";
  box.append(el("h2", { className: "sec", textContent: t("requirement.new") }));

  const name = el("input", { type: "text" });
  name.placeholder = t("requirement.namePlaceholder");
  const cat = el("select");
  for (const c of CATEGORIES) {
    cat.append(el("option", { value: String(c.pk), textContent: c.pathstring }));
  }
  const targetInput = el("input", { type: "number", value: "1" });
  targetInput.min = "0";
  targetInput.step = "1";

  /* The unit decides whether this requirement is counted or measured. Counted is right for
     anything bought by the piece (rolls, packets, batteries); measured for anything where the
     target is an amount and the packet size depends on the shop. */
  const unitSel = unitSelect();
  const targetField = field(t("field.target"), targetInput);
  const targetLabel = targetField.querySelector("label");
  unitSel.onchange = () => {
    targetInput.step = unitSel.value ? "0.25" : "1";
    if (targetLabel) {
    targetLabel.textContent = unitSel.value
      ? t("field.target") + " (" + unitLabel(unitSel.value) + ")" : t("field.target");
    }
  };

  box.append(field(t("field.name"), name), field(t("field.category"), cat),
           field(t("field.unit"), unitSel), targetField);
  box.append(el("div", { className: "hint", textContent: t("requirement.newHint") }));

  const row = el("div", { className: "buttons" });
  const ok = el("button", { className: "btn primary", textContent: t("common.create") });
  const no = el("button", { className: "btn ghost", textContent: t("common.cancel") });
  no.onclick = () => showTab(DETAIL_FROM);
  ok.onclick = () => withBusy(ok, async () => {
    if (!name.value.trim()) throw new Error(t("error.nameMissing"));
    const created = await api("/part/", {
      method: "POST",
      body: {
        name: name.value.trim(), description: t("requirement.description"),
        category: Number(cat.value),
        is_template: true, purchaseable: true, active: true,
        units: unitSel.value,
        minimum_stock: unitSel.value ? roundTarget(targetInput.value)
                                     : Number(targetInput.value || 0),
      },
    });
    PARTS.set(created.pk, created);
    toast(t("requirement.created"));
    // Straight into the new requirement: the next thing you want is almost always to look at it.
    openPart(created.pk, "buy");
  }, [no], true).catch((e) => toast(e.message, true));
  row.append(ok, no);
  box.append(row);
  name.focus();
}

// ---------------- expiring soon ---------------------------------------------
/* LEAD_FRACTION, LEAD_MIN_DAYS and LEAD_MAX_DAYS come from `expiry` in config.json — the
   same three numbers the expiry watchdog reads, so the app and the push cannot disagree about
   what "soon" means. docs/design.md has the reasoning. */

/* How many days before its expiry a batch starts being mentioned.

   Shelf life is the LARGER of the batch's own span (expiry minus the day it was booked in) and
   the kind's nominal durability (`default_expiry`, filled in from our category table).

   Taking only the batch collapses during a stocktake: enter everything on one day and "shelf
   life" equals "time left" for every row, so the warning always lands at the same fraction of
   the remainder. That is how UHT milk with 11 days to go stayed out of the list — 11 × 20 % is
   2 days, floored to 5 — while being the most urgent thing in the house. Taking only the
   nominal value is wrong the other way, for batteries dated years past their category default.
   The maximum is right in both directions. */
function leadDays(created, expiry, nominal) {
  const spans = [Number(nominal || 0)];
  if (created) spans.push(Math.round((expiry - created) / 86400000));
  const shelf = Math.max.apply(null, spans);
  if (shelf <= 0) return LEAD_MIN_DAYS;
  return Math.min(Math.max(Math.round(shelf * LEAD_FRACTION), LEAD_MIN_DAYS), LEAD_MAX_DAYS);
}

function expiryEntries() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const out = [];

  for (const it of STOCK_ALL) {
    // No date is not an expiry case. Batteries without one are simply not this tab's business.
    if (!it.expiry_date) continue;
    const expiry = new Date(it.expiry_date);
    const created = it.creation_date ? new Date(String(it.creation_date).slice(0, 10)) : null;
    const left = Math.round((expiry - today) / 86400000);
    const lead = leadDays(created, expiry, (it.part_detail || {}).default_expiry);
    if (left > lead) continue;
    out.push({ it: it, left: left, lead: lead });
  }

  return out.sort((a, b) => a.left - b.left);
}

function drawExpiry() {
  const box = $("#expirylist");
  const entries = expiryEntries();
  box.innerHTML = "";
  box.append(el("h2", { className: "sec", textContent: t("tab.expiry") }));

  if (!entries.length) {
    box.append(el("div", { className: "hint", textContent: t("expiry.nothing") }));
    return;
  }

  for (const e of entries) {
    const it = e.it;
    const pd = it.part_detail || {};
    const row = el("button", { className: "btn ghost buyrow" });
    row.title = t("article.open");
    const name = pd.full_name || t("article.fallbackName", { pk: it.part });
    row.append.apply(row, miniThumb(pd, name));

    const who = el("div", { className: "grow" });
    who.append(el("div", { textContent: name }));
    who.append(el("div", {
      className: "meta",
      textContent: fmtQty(it.quantity, unitsOf(PARTS.get(it.part) || pd)) + " · "
                 + locName(it.location),
    }));
    const line = el("div", { className: "dates" });
    line.append(expiryPill(it.expiry_date));
    line.append(el("span", {
      className: "pill" + (e.left < 0 ? " bad" : e.left <= LEAD_MIN_DAYS ? " warn" : ""),
      // The remaining time in words, because "13.9.2027" alone does not say whether that is
      // soon — which is the entire question this tab answers.
      textContent: daysLeft(e.left),
    }));
    who.append(line);
    row.append(who);

    const chev = el("div", { className: "chev" });
    chev.innerHTML = icon("chevron", 24);
    row.append(chev);

    row.onclick = () => openPart(it.part, "expiry");
    row.dataset.pk = String(it.part);
    box.append(row);
  }

  focusLastRow(box);
}

async function renderExpiry() {
  const cold = !STOCK_ALL.length;
  if (cold) { $("#expirylist").innerHTML = ""; $("#expirylist").append(hintCard(t("common.loading"), "hint")); }
  else drawExpiry();

  try {
    await loadStockData();
  } catch (e) {
    if (cold) { $("#expirylist").innerHTML = ""; $("#expirylist").append(hintCard(e.message, "err")); }
    return;
  }
  drawExpiry();
  drawTabs();
  LAST_OPENED = null;
}

const TABS = [
  ["stock", "list", "tab.stock"],
  ["buy", "cart", "tab.buy"],
  ["expiry", "hourglass", "tab.expiry"],
  ["scan", "scan", "tab.scan"],
];

/* The bar itself: icon over label, plus a count on the shopping tab so the number of missing things is
   visible without opening the tab — which is the entire reason it is its own destination and
   not a filter you have to remember to switch on. */
function drawTabs() {
  for (const [id, name, label] of TABS) {
    const b = $("#tab-" + id);
    b.innerHTML = "";
    const ic = el("span", { className: "tabic" });
    ic.innerHTML = icon(name, 24);
    if (id === "buy") {
      // The badge counts SHOPPING-LIST positions, not short products in stock. Since staples exist, a
      // shortfall belongs to a requirement, and a requirement holds no stock of its own — counting
      // stocked articles left the badge permanently at zero with 79 things missing.
      const n = shoppingEntries().length;
      if (n) ic.append(el("span", { className: "badge", textContent: fmtNum(n) }));
    }
    if (id === "expiry") {
      const n = expiryEntries().length;
      if (n) ic.append(el("span", { className: "badge", textContent: fmtNum(n) }));
    }
    b.append(ic, el("span", { textContent: t(label) }));
  }
}

/* The app proper. Called once we hold a working token; rebuilds the two views from scratch
   because showLogin() will have emptied <main>. */
const APP_HTML = document.querySelector("main").innerHTML;

let LOCATIONS_PENDING = null;

async function startApp() {
  // Fired before the identity check is awaited: the locations do not depend on it, and in
  // series the two round trips simply added up.
  LOCATIONS_PENDING = Promise.all([
    api("/stock/location/?limit=500"),
    api("/part/category/?limit=500"),
  ]);
  /* The lists' data, started now and awaited before the curtain goes up. Without it the first
     screen was drawn "cold" — empty cards saying "loading" under a curtain that had already
     lifted. A failure here is not fatal: the list then shows its own error, as before. */
  const firstData = loadStockData().catch(() => null);
  document.querySelector("main").innerHTML = APP_HTML;
  applyStatic(document.querySelector("main"));
  document.querySelector("nav").hidden = false;
  $("#logout").hidden = false;

  for (const [id] of TABS) $("#tab-" + id).onclick = () => showTab(id);
  drawTabs();
  // The button does not navigate by itself but takes back one history entry — the same move
  // as the Android gesture, so both go the same way. The tabs stay the second way out, which
  // is why the detail page is never a dead end.
  $("#detailback").onclick = () => history.back();
  $("#searchicon").innerHTML = icon("search");
  $("#qclear").innerHTML = icon("close", 20);
  const applyQuery = () => {
    STOCK_QUERY = $("#q").value.trim().toLowerCase();
    $("#qclear").hidden = !$("#q").value;
    // No debounce and no refetch: the rows are already in memory, so this is a filter over a
    // few hundred objects — faster than the keystroke that triggered it.
    drawChips();
    drawStocktake();
  };
  $("#q").addEventListener("input", applyQuery);
  $("#qclear").onclick = () => { $("#q").value = ""; applyQuery(); $("#q").focus(); };

  $("#buysearchicon").innerHTML = icon("search");
  $("#buyqclear").innerHTML = icon("close", 20);
  const applyBuyQuery = () => {
    BUY_QUERY = $("#buyq").value.trim().toLowerCase();
    $("#buyqclear").hidden = !$("#buyq").value;
    drawBuy();
  };
  $("#buyq").addEventListener("input", applyBuyQuery);
  $("#buyqclear").onclick = () => { $("#buyq").value = ""; applyBuyQuery(); $("#buyq").focus(); };
  const fill = (sel, name, text) => {
    const b = $(sel);
    b.innerHTML = "";
    const ic = el("span", { className: "ic" });
    ic.innerHTML = icon(name);
    b.append(ic, el("span", { textContent: text }));
  };
  fill("#go", "search", t("scan.search"));
  // It was called "camera" while it toggled the running camera. Now it only appears when the
  // camera is NOT running — then the button is an offer to try again.
  fill("#camBtn", "camera", t("scan.cameraOn"));
  // The search button carries the spinner however the lookup was started — by tap or by Enter.
  const search = () => withBusy($("#go"), () => lookup($("#ean").value));
  $("#go").onclick = search;
  $("#camBtn").onclick = startCam;
  $("#ean").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); search(); }
  });

  // boot() has already validated the token and filled ME; only the password path arrives here
  // without it.
  if (!ME) {
    try {
      ME = await api("/user/me/", { quiet: true });
    } catch (e) {
      return signOut(t("auth.expired"));
    }
  }
  $("#who").textContent = ME.username || "";
  $("#logout").innerHTML = icon("logout", 20);

  const [locs, cats] = await LOCATIONS_PENDING;
  LOCATIONS = (locs.results || locs || []).sort(
    (a, b) => byName(a.pathstring, b.pathstring));
  // Only leaves: a structural category refuses to hold parts, so offering it would produce an
