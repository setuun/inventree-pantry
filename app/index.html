<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Pantry</title>
<link rel="manifest" id="manifest" href="manifest.en.webmanifest">
<script>
  /* The home-screen name comes from the manifest, and the browser reads it long before the
     app has loaded anything. So the language is guessed here, with the same order the app uses
     later (own choice, then the browser), and only the manifest link is swapped. The list must
     match LANGUAGES below; tools/check-app.py compares the two. */
  (function () {
    var have = ["de", "en", "ru", "zh"];
    var pick = null;
    try { pick = localStorage.getItem("vorrat.lang"); } catch (e) { /* private mode */ }
    if (have.indexOf(pick) < 0) {
      pick = null;
      var nav = navigator.languages || [navigator.language || ""];
      for (var i = 0; i < nav.length && !pick; i++) {
        var base = String(nav[i]).toLowerCase().split("-")[0];
        if (have.indexOf(base) >= 0) pick = base;
      }
    }
    document.getElementById("manifest").href = "manifest." + (pick || "en") + ".webmanifest";
  })();
</script>
<!--
  Pantry ("Vorrat") — a phone-sized front end for the three things a household actually does
  to an InvenTree stock item: book some in, use some up, count what is there.
  https://github.com/setuun/inventree-pantry — MIT licensed.

  WHY THIS EXISTS (docs/design.md)
  The official Flutter app is an industrial stock-control client: every one of those three
  actions is several screens deep, behind Part -> Stock Item -> Adjust. That is correct for a
  warehouse and is the reason the pantry stopped being maintained. This page is the same three
  actions as three buttons.

  WHY IT IS SERVED FROM INVENTREE'S OWN ORIGIN, and not from anywhere nicer: no CORS preflight
  on any call, and an existing /web/ session can be traded for an API token without the user
  typing anything. The price is one extra route in InvenTree's own Caddyfile and a read-only
  mount; both are in deploy/.

  LANGUAGES: every word on screen comes from i18n/<lang>.json. See TRANSLATING.md.
  CONFIGURATION: config.json next to this file (the same pantry.json the plugin reads).

  AUTH: one login, then a year of silence. See the `auth` section below.
-->
<style>
  /* Material Design dark theme, applied unconditionally rather than following the system.
     The rules it actually imposes, since they are easy to undo by accident:
       · the base surface is #121212, never pure black — black kills the sense of elevation
       · higher surfaces are lighter, not shadowed: a card is #121212 with a white overlay
         (~5% at 1dp), which is where #1E1E1E comes from
       · text is white at fixed opacities: 87% primary, 60% secondary, 38% disabled
       · saturated brand colours are replaced by their 200/300 tints, because a vivid hue on
         a dark surface vibrates; #90CAF9 is Blue 200, and it carries BLACK text
       · the error colour is #CF6679, Material's own dark-theme error
     `color-scheme: dark` is not decoration: without it the browser still draws <select> and
     <input type=date> — including the date picker popup — as light-mode widgets. */
  :root {
    color-scheme: dark;
    --bg: #121212;
    --card: #1e1e1e;            /* 1dp: #121212 + 5% white */
    --card-2: #242424;          /* 4dp, for a surface sitting on a surface */
    --ink: rgba(255, 255, 255, 0.87);
    --muted: rgba(255, 255, 255, 0.60);
    --line: rgba(255, 255, 255, 0.12);
    --accent: #90caf9;          /* Blue 200 */
    --accent-ink: rgba(0, 0, 0, 0.87);
    --ok: #81c784;              /* Green 300 */
    --warn: #ffb74d;            /* Orange 300 */
    --bad: #cf6679;             /* Material dark error */
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  /* The curtain: the app's mark over a spinner, on the page's own background, until the first
     screen is drawn WITH its data. It fades rather than vanishing, and `visibility` flips only
     after the fade, so it stops catching taps the moment it starts to go. */
  #boot {
    position: fixed; inset: 0; z-index: 60; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; transition: opacity .2s ease-out, visibility 0s linear .2s;
  }
  #boot .bootmark { color: var(--accent); display: flex; }
  #boot .bootmark svg { fill: currentColor; display: block; }
  body.ready #boot { opacity: 0; visibility: hidden; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { #boot { transition: none; } }
  .ring {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* A spinner that cannot spin should at least not sit there as a broken-looking ring. */
  @media (prefers-reduced-motion: reduce) {
    .ring { animation: none; border-top-color: var(--line); opacity: .6; }
  }

  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  /* Same surface and height as the bottom bar, so the page reads as content held between two
     bars rather than as a heading that happens to stick. The old rule was a leftover: it still
     carried the bottom margin from when the tabs sat underneath it, a float for the sign-out
     link, and an underlined text link in an interface that speaks in icons everywhere else. */
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 0 14px; min-height: 56px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .brand .mark { display: flex; color: var(--accent); flex: none; }
  .brand .mark svg { fill: currentColor; display: block; }
  h1 { font-size: 18px; font-weight: 700; margin: 0; letter-spacing: .2px; }
  /* The version is genuinely used — to tell at a glance whether the phone has the deploy you
     just made — so it stays, but as a quiet chip rather than as part of the title. */
  .ver {
    font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 7px; flex: none;
  }
  .hdrright { display: flex; align-items: center; gap: 4px; flex: none; }
  #who { color: var(--muted); font-size: 13px; }
  /* The language picker is a real <select>, laid invisibly over a small chip: the platform
     draws the list (and reads it out), the header only has to show two letters. */
  /* `margin: 0` is not decoration: this is a <label>, and the shared label rule gives every
     label a 4px bottom margin — which lifted the two letters visibly above the name and the
     sign-out icon beside them. */
  .langpick {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    min-width: 40px; height: 40px; margin: 0; line-height: 1;
    color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .04em;
  }
  #who { line-height: 1; }
  .langpick select {
    position: absolute; inset: 0; opacity: 0; width: 100%; min-height: 0; padding: 0;
    cursor: pointer;
  }
  button.btn.iconbtn#logout {
    width: 40px; min-height: 40px; border: 0; background: none; color: var(--muted);
  }
  /* Sits clear of the bar and of the home indicator, on the side the thumb reaches. Above the
     content but below the messages, so a confirmation is never hidden by the button that
     caused it. */
  .fab {
    position: fixed; right: 16px; z-index: 25;
    bottom: calc(72px + env(safe-area-inset-bottom));
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 48px; padding: 0 20px; border: 0; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink);
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
  }
  .fab svg { fill: currentColor; display: block; }
  .fab:active { filter: brightness(.92); }

  nav.bottombar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: flex; background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.bottombar button {
    flex: 1; border: 0; background: none; color: var(--muted); font: inherit;
    font-size: 11px; font-weight: 600; cursor: pointer; padding: 8px 4px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 56px;
  }
  nav.bottombar button svg { fill: currentColor; display: block; }
  nav.bottombar button[aria-selected="true"] { color: var(--accent); }
  nav.bottombar .tabic { position: relative; display: flex; }
  nav.bottombar .badge {
    position: absolute; top: -5px; left: 13px;
    background: var(--bad); color: rgba(0, 0, 0, 0.87);
    border-radius: 999px; font-size: 10px; line-height: 1; padding: 3px 5px; font-weight: 700;
  }
  /* The bar is fixed, so the last card needs room to clear it — 56px of bar plus the home
     indicator on phones that have one. */
  main {
    padding: 14px; max-width: 640px; margin: 0 auto;
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
  }
  button.btn.buyrow {
    display: flex; align-items: center; gap: 12px; padding: 12px 0; width: 100%;
    border: 0; border-top: 1px solid var(--line); background: none; text-align: left;
    border-radius: 0; font-weight: 400;
  }
  /* A section heading already draws a rule; the first row's own top border lands right under
     it and reads as a double line.
     ⚠️ The selector must out-specify the base rule, not merely come after it:
     `.buyrow:first-of-type` is (0,2,0) and lost against `button.btn.buyrow` (0,2,1), so the
     earlier attempt at this was dead CSS that looked correct. Same trap as .iconbtn and the
     width. */
  button.btn.buyrow:first-of-type { border-top: 0; }
  /* Brief mark on the row you just came back from — enough to find your place at a glance,
     short enough not to look like a selection that means something. */
  .justleft { background: rgba(144, 202, 249, 0.14) !important; border-radius: 8px; }

  .buyrow .need { font-weight: 700; color: var(--bad); font-variant-numeric: tabular-nums; }
  /* Room for the floating button, so it never covers the last entry of the list. */
  #view-buy { padding-bottom: 60px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; margin-bottom: 12px;
  }
  .row { display: flex; gap: 10px; align-items: center; }
  .row + .row { margin-top: 10px; }
  .grow { flex: 1; min-width: 0; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select, button.btn {
    font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    /* A control on a card must not be the same colour as the card, or it disappears. In
       Material terms it is simply the next elevation up. */
    background: var(--card-2); color: var(--ink); width: 100%; min-height: 48px;
  }
  /* The platform's own dropdown marker is a small glyph pinned to the very edge, and it does
     not scale with anything we set. Replaced by the same chevron the rest of the app uses,
     drawn as a background image at 20px with real space around it — `appearance: none` removes
     the original, and the extra right padding keeps long option text from running under it.
     The colour is written out because a data URI cannot read a custom property; it matches
     what --muted resolves to on this surface. */
  select {
    appearance: none; -webkit-appearance: none;
    padding-right: 44px;
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a6a6a6'><path d='M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 20px 20px;
  }

  button.btn {
    cursor: pointer; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn .ic { display: inline-flex; }
  .btn svg { fill: currentColor; display: block; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  button.ghost { background: transparent; }
  /* Mobile first, and this is the whole point: three buttons sharing a 360px screen gives
     each of them ~110px, which reads as cramped and mis-taps. Stack by default; go side by
     side only once there is actually room. Same for the confirm/cancel pair in a panel. */
  .actions { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 12px; }
  /* A pair of one-word buttons is fine side by side even on the narrowest phone, and stacking
     them would only push the form further down. It is the THREE-across row that was cramped. */
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .buttons.solo { grid-template-columns: 1fr; }
  @media (min-width: 480px) { .actions { grid-template-columns: 1fr 1fr 1fr; } }
  .name { font-weight: 650; font-size: 17px; word-break: break-word; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .qty { font-variant-numeric: tabular-nums; font-weight: 650; }
  ul.stock { list-style: none; margin: 12px 0 0; padding: 0; }
  /* One row = three stacked lines: what it is, how much and where, then the date with the
     two controls beside it. Side by side, the name and a date pill and two buttons leave the
     name about a third of a phone, which is what made this list unreadable. */
  ul.stock li { padding: 12px 0; border-top: 1px solid var(--line); }
  /* A section heading already draws a rule. Where a list follows one directly, the first row's
     own top border lands right under it and reads as a double line — so drop it there, and
     only there: in the overview the list follows a plain count line and needs its separator. */
  h2.sec + ul.stock > li:first-child { border-top: 0; padding-top: 0; }
  .rowfoot {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-top: 8px;
  }
  .rowacts { display: flex; gap: 8px; flex: none; }
  .pill {
    font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    border: 1px solid var(--line); color: var(--muted);
  }
  .pill.ok { color: var(--ok); border-color: var(--ok); }
  .pill.warn { color: var(--warn); border-color: var(--warn); }
  .pill.bad { color: var(--bad); border-color: var(--bad); }
  /* `button.btn.iconbtn`, not `.iconbtn`: the shared control rule above is `button.btn`
     (specificity 0,1,1) and sets width:100%, so a plain single class loses to it and the
     pencil renders 135px wide, shoving the row past the viewport. Measured at 390px before
     this was pinned down. Same family of trap as `[hidden]` vs an author `display`. */
  button.btn.iconbtn {
    width: 44px; min-height: 44px; flex: none; display: inline-flex;
    align-items: center; justify-content: center; padding: 0;
  }
  button.btn.danger {
    background: var(--bad); color: rgba(0, 0, 0, 0.87); border-color: transparent;
  }
  .iconbtn.warnink { color: var(--bad); }
  .iconbtn svg { width: 20px; height: 20px; fill: currentColor; display: block; }
  /* Placeholder where a part has no picture yet — dashed says "empty, and you may fill it". */
  .thumb.empty {
    border-style: dashed; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 11px; text-align: center; line-height: 1.2; padding: 4px;
  }
  .thumb { cursor: pointer; }
  /* The product name in the stock list opens its card. Without this there is no route from
     the inventory to a product at all — which is how "add a picture later" ended up
     unreachable for anything you were not holding a barcode for. */
  /* An overview row is one tap target for the whole article — name, place and date are what
     you read, the detail page is where you act. */
  button.btn.rowlink {
    display: flex; gap: 12px; align-items: center; text-align: left;
    width: 100%; padding: 10px 0; border: 0; background: none; min-height: 0;
  }
  /* Not scoped to .rowlink: the expiry list draws the same rows out of .buyrow, and an article
     has to be recognisable by its picture in both places. */
  .mini {
    width: 48px; height: 48px; flex: none; object-fit: cover; border-radius: 8px;
    background: var(--card-2); border: 1px solid var(--line);
  }
  .mini.empty {
    border-style: dashed; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 16px;
  }
  .rowlink .who { min-width: 0; flex: 1; }
  .rowlink .who .nm { font-weight: 600; }
  .rowlink .chev { color: var(--muted); flex: none; display: flex; }
  .rowlink .chev svg { fill: currentColor; display: block; }
  .dates { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  button.btn.back { width: auto; min-height: 40px; padding: 8px 12px; margin-bottom: 10px; }
  .detailhead { display: flex; gap: 14px; align-items: flex-start; }
  .detailhead .thumb { width: 96px; height: 96px; }
  .facts { margin-top: 12px; }
  .facts div { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; }
  .facts .k { color: var(--muted); }
  .facts .v { text-align: right; }
  h2.sec {
    font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 12px;
    padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .thumbwrap { flex: none; }
  .lightbox {
    position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.92);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
  button.btn.iconbtn.lbclose {
    position: absolute; top: 12px; right: 12px; background: none; border: 0;
    color: rgba(255, 255, 255, 0.87);
  }
  /* A row of chips beats a <select> here: the whole point is to see everything first and
     narrow only if you want to, and a dropdown hides both the options and the counts behind
     a tap. Scrolls sideways inside itself, so the page body never does. */
  .searchbox { position: relative; margin-bottom: 14px; }
  .searchbox .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--muted); display: flex; pointer-events: none; }
  .searchbox .ic svg { fill: currentColor; display: block; }
  .searchbox input { padding-left: 42px; padding-right: 46px; font-size: 16px; }
  /* The browser's own clear button is a font glyph: it cannot be sized, coloured or aligned,
     and next to a 20px SVG magnifier it looks like a speck. Hidden, and replaced with one of
     ours that obeys the same icon rules as everything else. */
  .searchbox input::-webkit-search-cancel-button,
  .searchbox input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
  button.btn.iconbtn.clear {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 38px; min-height: 38px; border: 0; background: none; color: var(--muted);
  }
  /* Two controls for two different questions, side by side, never scrolling sideways.
     The place is a <select>: it holds any number of shelves behind one tap and the platform
     draws the picker, where the chip row this replaces grew a horizontal scrollbar as soon as
     the house had more than a few locations. "Fehlt" is a separate toggle because it asks a
     different question — it narrows the same list by another criterion and COMBINES with a
     place, which a row of chips could only ever express as "exactly one of these is on". */
  .filterrow { display: flex; gap: 8px; align-items: stretch; }
  .filterrow select { flex: 1; min-width: 0; font-size: 16px; }
  button.btn.shortbtn {
    flex: none; width: auto; padding: 0 14px; gap: 6px; font-size: 14px;
    border-color: var(--bad); color: var(--bad); background: var(--card-2);
  }
  button.btn.shortbtn[aria-pressed="true"] {
    background: var(--bad); color: rgba(0, 0, 0, 0.87); border-color: transparent;
  }
  .shortbtn .n { font-variant-numeric: tabular-nums; opacity: .8; }
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .suggest button.btn {
    width: auto; min-height: 42px; padding: 8px 16px; border-radius: 999px;
    font-size: 14px; border-color: var(--accent); color: var(--accent); background: none;
  }
  .facts .v.short { color: var(--bad); font-weight: 700; }
  .facts .v.fine { color: var(--ok); }
  .head { display: flex; gap: 12px; align-items: flex-start; }
  .thumb {
    width: 64px; height: 64px; flex: none; object-fit: cover; border-radius: 10px;
    background: var(--card-2); border: 1px solid var(--line);
  }
  .panel { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .field { margin-bottom: 14px; }
  .field label { font-size: 14px; margin-bottom: 6px; }
  /* Selects need the arrow drawn by the platform, but iOS shrinks the text to 11px unless the
     font size is stated; 16px also stops mobile Safari zooming the page on focus. */
  .field select, .field input { font-size: 16px; }
  .field .hint { margin-top: 5px; }
  /* `display: block` here is an AUTHOR rule and would beat the browser's own
     `[hidden] { display: none }` — which is an origin below it, not merely a weaker selector.
     Without the guard below, the video sits there as a black box before the camera is ever
     switched on. Hence both lines; neither is redundant. */
  #cam {
    width: 100%; border-radius: var(--radius); background: #000; display: block;
    margin-top: 10px;   /* keep it off the Suchen/Kamera row */
  }
  [hidden] { display: none !important; }
  .hint { color: var(--muted); font-size: 13px; }
  /* Centred, not bottom-anchored: at the bottom the fixed tab bar (z-index 30) simply covered
     it, so the one message that has to be read — the warning before leaving — was invisible.
     Above the lightbox as well, since a message about what just happened outranks the picture
     it happened over; only the boot curtain sits higher. */
  .toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 55;
    background: var(--card-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 20px; font-size: 15px; line-height: 1.35; text-align: center;
    max-width: min(86vw, 340px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    animation: toastin .14s ease-out;
  }
  .toast.err { border-color: var(--bad); color: var(--bad); }
  @keyframes toastin {
    from { opacity: 0; transform: translate(-50%, -50%) scale(.96); }
  }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
  .err { color: var(--bad); }

  /* A button that is waiting for the server. Its label turns transparent — so the button keeps
     its exact size and the row does not jump — and a ring spins where the label was, in the
     colour the label had (--busy-ink, set per button style below). Added only after a short
     delay by withBusy(), so a fast answer never flickers. */
  button.btn { --busy-ink: var(--ink); }
  button.btn.primary { --busy-ink: var(--accent-ink); }
  button.btn.danger { --busy-ink: rgba(0, 0, 0, 0.87); }
  .suggest button.btn { --busy-ink: var(--accent); }
  button.btn:disabled { cursor: default; }
  /* Locked while a neighbour works (the Cancel next to a busy Save) — it should look it. */
  button.btn:disabled:not(.busy) { opacity: .45; }
  button.btn.busy { position: relative; color: transparent !important; }
  button.btn.busy::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
    border: 2px solid var(--busy-ink); border-right-color: transparent;
    animation: spin .7s linear infinite;
  }
  /* The same ring over a product picture while it uploads. */
  .thumbwrap { position: relative; }
  .thumbwrap.busy::after {
    content: ""; position: absolute; inset: 0; border-radius: 10px;
    background: rgba(18, 18, 18, 0.6);
  }
  .thumbwrap.busy::before {
    content: ""; position: absolute; left: 50%; top: 50%; z-index: 1;
    width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%;
    border: 2px solid var(--accent); border-right-color: transparent;
    animation: spin .7s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    button.btn.busy::after, .thumbwrap.busy::before { animation: none; opacity: .7; }
  }
</style>
</head>
<body>
<!-- Covers everything until the app knows which page it is on. Without it a reload visibly
     renders the stock list first and only then swings over to the page you were actually on:
     restoring a detail view has to put its list up behind it, and then fetch. It is markup
     rather than something the script creates, so it is on screen from the first paint. -->
<div id="boot">
  <!-- Written out rather than drawn by the script: the curtain has to look right from the very
       first paint, before any script has run. Same path as ICON.box. -->
  <span class="bootmark"><svg viewBox="0 0 24 24" width="56" height="56" aria-hidden="true"><path d="M20 2H4c-1 0-2 .9-2 2v3.01c0 .72.43 1.34 1 1.69V20c0 1.1 1.1 2 2 2h14c.9 0 2-.9 2-2V8.7c.57-.35 1-.97 1-1.69V4c0-1.1-1-2-2-2zm-5 12H9v-2h6v2zm5-7H4V4h16v3z"/></svg></span>
  <div class="ring" role="status" data-i18n-aria-label="common.loading"></div>
</div>

<!-- Text in the markup is marked, not written: `data-i18n` fills textContent, and
     `data-i18n-<attribute>` fills that attribute. applyStatic() does both, once at boot and
     again whenever the app puts this markup back after a login. -->
<header>

<!-- Floats above the bar rather than sitting at the end of the list. On a list of eighty

     it away. -->

<!-- A bottom bar, because this is used one-handed while standing at a shelf: the thumb
     reaches the bottom of a phone, not the top. The default tab must be marked here too, or a
     reload visibly starts on the wrong one and jumps. -->

  <button id="tab-stock" aria-selected="true"></button>

  <button id="tab-expiry" aria-selected="false"></button>
  <button id="tab-scan" aria-selected="false"></button>

<script>
"use strict";

/* VOCABULARY — the code speaks English, the interface speaks whatever i18n/<lang>.json says,
   and these are the words that matter (German in brackets, the language it was built in):
     requirement  ("Bedarf")    the thing you shop for; holds the target, no barcode, no stock
     variety      ("Sorte")     a concrete product under a requirement; holds the barcode
     target       ("Soll")      how many you want to keep
     batch        ("Charge")    one stock row: a quantity, a place and one expiry date
     stock        ("Bestand")   what is actually there
     location     ("Lagerort")  where it lies
   In InvenTree's own words a requirement is a template part and a variety is its variant. */

const VERSION = "2.2.0";

// --- tiny helpers ------------------------------------------------------------
const $ = (s) => document.querySelector(s);
const el = (tag, props) => Object.assign(document.createElement(tag), props || {});

// --- configuration -----------------------------------------------------------
/* Read from config.json next to this page — the same pantry.json the plugin, the taxonomy
   script and the expiry watchdog read, so all four agree on names and on what "soon" means.
   Every key has a default, and a missing file is not an error: the page then runs with no
   preferred shelf and the stock warning rule below. */
const CONFIG_DEFAULTS = {
  language: "en",
  pack_parameter: "Pack content",
  app: { book_location: "" },
  openfoodfacts: { fallback_location: "" },
  expiry: { warn_days: 7, lead_fraction: 0.2, lead_min_days: 5, lead_max_days: 90 },
};
let CONFIG = CONFIG_DEFAULTS;

async function loadConfig() {
  try {
    const res = await fetch("config.json", { cache: "no-cache" });
    // The Caddy route answers an unknown path with index.html, so a 200 is not proof of JSON.
    const data = res.ok ? await res.json() : null;
    if (data && typeof data === "object") {
      CONFIG = Object.assign({}, CONFIG_DEFAULTS, data, {
        app: Object.assign({}, CONFIG_DEFAULTS.app, data.app),
        openfoodfacts: Object.assign({}, CONFIG_DEFAULTS.openfoodfacts, data.openfoodfacts),
        expiry: Object.assign({}, CONFIG_DEFAULTS.expiry, data.expiry),
      });
    }
  } catch (e) { /* no config.json: defaults */ }
}

/* Read once, after loadConfig(). Kept as plain constants so the rest of the code reads the
   way it did when these were baked in at deploy time. */
let DEFAULT_LOCATION = "", BOOK_LOCATION = "", WARN_DAYS = 7, PACK_NAME = "";
let LEAD_FRACTION = 0.2, LEAD_MIN_DAYS = 5, LEAD_MAX_DAYS = 90;

function applyConfig() {
  DEFAULT_LOCATION = CONFIG.openfoodfacts.fallback_location || "";
  BOOK_LOCATION = CONFIG.app.book_location || "";
  PACK_NAME = CONFIG.pack_parameter || CONFIG_DEFAULTS.pack_parameter;
  WARN_DAYS = Number(CONFIG.expiry.warn_days) || 0;
  LEAD_FRACTION = Number(CONFIG.expiry.lead_fraction) || 0;
  LEAD_MIN_DAYS = Number(CONFIG.expiry.lead_min_days) || 0;
  LEAD_MAX_DAYS = Number(CONFIG.expiry.lead_max_days) || 0;
}

// --- languages ---------------------------------------------------------------
/* The registry of shipped languages. Adding one means: i18n/<code>.json, a
   manifest.<code>.webmanifest, one line here and the code in the <head> list — TRANSLATING.md
   walks through it, and tools/check-app.py refuses a language that is missing any of them.
   `locale` is what Intl formats dates, numbers and sorting with. */
const LANGUAGES = {
  de: { name: "Deutsch", locale: "de-DE" },
  en: { name: "English", locale: "en-GB" },
  ru: { name: "Русский", locale: "ru-RU" },
  zh: { name: "中文", locale: "zh-CN" },
};
const LANG_KEY = "vorrat.lang";

let LANG = "en";
let LOCALE = "en-GB";
let STR = {};          // the chosen language
let FALLBACK = {};     // English, for any key a translation has not caught up with yet
let PLURAL = null;

/* Own choice first, then the browser, then the household's default from config.json. The
   browser outranks the config on purpose: one install serves a whole household, and the
   person holding the phone is the one who has to read it. */
function pickLanguage() {
  let own = null;
  try { own = localStorage.getItem(LANG_KEY); } catch (e) { /* private mode */ }
  if (own && LANGUAGES[own]) return own;
  for (const tag of (navigator.languages || [navigator.language || ""])) {
    const base = String(tag).toLowerCase().split("-")[0];
    if (LANGUAGES[base]) return base;
  }
  return LANGUAGES[CONFIG.language] ? CONFIG.language : "en";
}

async function loadStrings(code) {
  try {
    const res = await fetch("i18n/" + code + ".json", { cache: "no-cache" });
    return res.ok ? await res.json() : {};
  } catch (e) { return {}; }
}

async function loadLanguage() {
  LANG = pickLanguage();
  LOCALE = LANGUAGES[LANG].locale;
  const [own, en] = await Promise.all([loadStrings(LANG), LANG === "en" ? null : loadStrings("en")]);
  STR = own;
  FALLBACK = en || own;
  PLURAL = new Intl.PluralRules(LOCALE);
  document.documentElement.lang = LANG;
  document.title = t("app.name");
}

/* One lookup for every word on screen.
     t("tab.stock")                     plain text
     t("stock.have", { amount: "2 kg" }) {amount} is replaced
     t("days.in", { n: 3 })             the value is an object of plural forms, picked by
                                        Intl.PluralRules for `n` (Russian needs one/few/many)
   A key that exists nowhere comes back as itself, which is ugly on purpose: it is visible. */
function t(key, vars) {
  let s = key in STR ? STR[key] : key in FALLBACK ? FALLBACK[key] : key;
  if (s && typeof s === "object") {
    const n = Number(vars && vars.n);
    s = s[PLURAL.select(n)] ?? s.other ?? "";
  }
  return String(s).replace(/\{(\w+)\}/g, (m, k) => (vars && k in vars ? String(vars[k]) : m));
}

/* Fill every marked element under `root`: data-i18n sets the text, data-i18n-<attr> sets
   that attribute. */
function applyStatic(root) {
  for (const node of (root || document).querySelectorAll("*")) {
    for (const a of [...node.attributes]) {
      if (a.name === "data-i18n") node.textContent = t(a.value);
      else if (a.name.startsWith("data-i18n-")) node.setAttribute(a.name.slice(10), t(a.value));
    }
  }
}

/* A change of language reloads the page. Everything on screen is built from strings at the
   moment it is drawn, and a reload is the one way to be sure none is left behind; the view the
   user was on survives it (see saveView). */
function drawLanguagePicker() {
  const sel = $("#lang");
  sel.innerHTML = "";
  for (const [code, info] of Object.entries(LANGUAGES)) {
    sel.append(el("option", { value: code, textContent: info.name }));
  }
  sel.value = LANG;
  $("#langcode").textContent = LANG.toUpperCase();
  sel.onchange = () => {
    try { localStorage.setItem(LANG_KEY, sel.value); } catch (e) { /* this session only */ }
    location.reload();
  };
  $("#langpick").hidden = false;
}

// --- formatting --------------------------------------------------------------
// Short date in the chosen language: 13.9.2028, 13/09/2028, 13.09.2028, 2028/9/13.
const fmtDate = (iso) => (iso ? new Date(iso).toLocaleDateString(LOCALE) : "");
const byName = (a, b) => (a || "").localeCompare(b || "", LOCALE);

/* Units are stored as InvenTree stores them ("", "kg", "l") and only DRAWN in the reader's
   script: кг and л in Russian, 公斤 and 升 in Chinese. The stored value never changes. */
function unitLabel(u) {
  if (!u) return "";
  const key = "unit." + u + ".short";
  const s = t(key);
  return s === key ? u : s;
}

/* Words for matching a product to a requirement. Intl.Segmenter where the browser has it —
   Chinese has no spaces, so splitting on non-letters would see a product name as ONE word —
   and a Unicode-aware split everywhere else. Brackets (brand), numbers and units (packet size)
   are dropped first: those are exactly what must NOT drive the match. */
const SEGMENTER = typeof Intl !== "undefined" && Intl.Segmenter ? new Map() : null;
const CJK = /[぀-ヿ㐀-鿿豈-﫿]/;

function words(s) {
  const bare = String(s || "").toLowerCase()
    .replace(/\([^)]*\)|（[^）]*）/g, " ")
    .replace(/\d+(?:[.,]\d+)?\s*(?:(?:kg|mg|g|ml|cl|l|stk|stück|er|pcs|шт|кг|мг|г|мл|л)(?!\p{L})|千克|公斤|毫升|克|升|个|袋|瓶|罐|包)?/gu, " ");
  let out;
  if (SEGMENTER) {
    if (!SEGMENTER.has(LOCALE)) SEGMENTER.set(LOCALE, new Intl.Segmenter(LOCALE, { granularity: "word" }));
    out = [...SEGMENTER.get(LOCALE).segment(bare)].filter((x) => x.isWordLike).map((x) => x.segment);
  } else {
    out = bare.split(/[^\p{L}\p{N}]+/u);
  }
  // Three letters is noise in German ("mit", "und"); two Chinese characters are a whole word.
  return out.filter((w) => w.length >= (CJK.test(w) ? 2 : 3));
}

/* How long a word has to be to count as evidence on its own. */
const strongWord = (w) => w.length >= (CJK.test(w) ? 2 : 4);

function toast(msg, isError) {
  // One at a time: two stacked in the middle of the screen would sit on top of each other.
  const old = document.querySelector(".toast");
  if (old) old.remove();

  const box = el("div", { className: "toast" + (isError ? " err" : ""), textContent: msg });
  document.body.appendChild(box);
  // An error has to be readable; 2.6 s is enough to confirm something worked and not enough
  // to read why something did not — which is how a failed photo upload looked like silence.
  setTimeout(() => box.remove(), isError ? 7000 : 2600);
}

/* Run `fn` while `btn` shows that it is working.

   The button is disabled at once — a second tap must not send a second request — but the
   spinner only appears after 150 ms: most answers are faster than that, and a spinner that
   flashes for one frame reads as a glitch rather than as feedback. `also` are buttons that must
   not be pressed meanwhile either (the Cancel next to a Save). A button that is already busy
   ignores the tap.

   `hold`: for actions that end by redrawing the view WITHOUT waiting for it (most forms call
   showPart() and return). Restoring the button the moment `fn` resolves would hand it back
   while the old view is still up, and a second tap would book the same thing twice. So on
   success it stays busy until the redraw takes it off the page — with a 10-second backstop,
   so a redraw that fails cannot leave it locked. A failure (an exception, including the
   form's own "name is missing") always restores it at once. */
async function withBusy(btn, fn, also, hold) {
  if (btn.disabled) return undefined;
  const others = (also || []).filter((b) => b && !b.disabled);
  btn.disabled = true;
  for (const b of others) b.disabled = true;
  btn.setAttribute("aria-busy", "true");
  const timer = setTimeout(() => btn.classList.add("busy"), 150);
  const restore = () => {
    clearTimeout(timer);
    btn.classList.remove("busy");
    btn.removeAttribute("aria-busy");
    btn.disabled = false;
    for (const b of others) b.disabled = false;
  };
  let result;
  try {
    result = await fn();
  } catch (e) {
    restore();
    throw e;
  }
  if (hold) setTimeout(() => { if (btn.isConnected) restore(); }, 10000);
  else restore();
  return result;
}

/* --- auth: one login, then a year of silence --------------------------------
   The page keeps an InvenTree API token in localStorage and sends it as
   `Authorization: Token …`.

   Why a token rather than the session cookie this page first used: the session belongs to the
   browser, so "signed in to /vorrat/" really meant "signed in to /web/ recently, in this same
   browser" — which is exactly the detour that made the page annoying, and it expires out from
   under a PWA sitting on the home screen. A token outlives that. It also drops the CSRF dance
   entirely: DRF's TokenAuthentication is CSRF-exempt, so no `csrftoken` cookie has to exist
   and no header has to be echoed. Verified live 2026-09-14: POST /api/barcode/ with only the
   token header succeeds.

   The password is sent exactly once, to the same origin, over TLS, and is never stored.
   The token is per DEVICE — its `name` carries a random id kept in localStorage — so it shows
   up as its own row under InvenTree's API tokens and can be revoked there without locking the
   other phones out. Minting is idempotent: asking again under the same name returns the SAME
   token instead of piling up new ones (verified). Tokens expire after a year; when that
   happens the next call 401s, the token is dropped and the login card comes back. */
const TOKEN_KEY = "vorrat.token";
const DEVICE_KEY = "vorrat.device";
let TOKEN = null;
let ME = null;

function deviceName() {
  let d = null;
  try { d = localStorage.getItem(DEVICE_KEY); } catch (e) { /* private mode */ }
  if (!d) {
    d = "vorrat-" + Math.random().toString(36).slice(2, 8);
    try { localStorage.setItem(DEVICE_KEY, d); } catch (e) { /* ignore */ }
  }
  return d;
}

function storeToken(token) {
  TOKEN = token;
  try {
    if (token) localStorage.setItem(TOKEN_KEY, token); else localStorage.removeItem(TOKEN_KEY);
  } catch (e) { /* the app still works for this session, just not the next one */ }
}

/* `auth` is the Authorization header to mint WITH: Basic for a typed password, or nothing at
   all to let an existing /web/ session vouch for us. Returns the token, or null. */
async function mintToken(auth) {
  let res;
  try {
    res = await fetch("/api/user/me/token/?name=" + encodeURIComponent(deviceName()),
                      { credentials: "same-origin", headers: auth ? { Authorization: auth } : {} });
  } catch (e) { return null; }
  if (!res.ok) return null;
  const data = await res.json().catch(() => null);
  return (data && data.token) || null;
}

async function api(path, opts) {
  const o = Object.assign({ credentials: "same-origin", headers: {} }, opts || {});
  // FormData must go through as-is: the browser has to set Content-Type itself so the
  // multipart boundary is included. Setting it by hand produces a request Django cannot parse.
  const isForm = typeof FormData !== "undefined" && o.body instanceof FormData;
  if (o.body !== undefined && typeof o.body !== "string" && !isForm) {
    o.headers["Content-Type"] = "application/json";
    o.body = JSON.stringify(o.body);
  }
  if (TOKEN) o.headers["Authorization"] = "Token " + TOKEN;

  const res = await fetch("/api" + path, o);
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = { detail: text }; }

  if (res.status === 401 || res.status === 403) {
    // `quiet` is for the boot probe, which expects to be turned away and handles it itself.
    if (!o.quiet) signOut(t("auth.expired"));
    throw new Error(t("auth.notSignedIn"));
  }
  if (!res.ok) throw new Error(apiError(data, res.status));
  return data;
}

/* DRF reports field problems as {"image": ["Upload a valid image."]} — none of the three keys
   we used to look at. A rejected photo therefore surfaced to the user as the bare string
   "400", which says nothing about what to do. Observed for real on 2026-09-15. */
function apiError(data, status) {
  if (!data) return String(status);

  const direct = data.error || data.detail || data.non_field_errors;
  if (direct) return Array.isArray(direct) ? direct.join(" ") : String(direct);

  if (typeof data === "object") {
    for (const key of Object.keys(data)) {
      const v = data[key];
      if (Array.isArray(v) && v.length) return key + ": " + v[0];
      if (typeof v === "string" && v) return key + ": " + v;
    }
  }

  return String(status);
}

/* Raise the curtain. Called once the restored page is on screen with its data, or when the
   login card goes up instead — and, as a last resort, by a timer in boot(), so no failure
   anywhere can leave the curtain down. */
function ready() {
  document.body.classList.add("ready");
}

function signOut(msg) {
  storeToken(null);
  ME = null;
  showLogin(msg);
}

function showLogin(msg) {
  ready();
  $("#logout").hidden = true;
  $("#who").textContent = "";
  document.querySelector("nav").hidden = true;
  const main = document.querySelector("main");
  main.innerHTML = "";

  const c = el("div", { className: "card" });
  if (msg) c.append(el("div", { className: "err", textContent: msg }));
  c.append(el("p", { className: "hint", textContent: t("auth.intro") }));

  const u = el("input", { id: "u", autocomplete: "username", placeholder: t("auth.username") });
  const pw = el("input", { id: "pw", type: "password", autocomplete: "current-password",
                           placeholder: t("auth.password") });
  const go = el("button", { className: "btn primary", textContent: t("auth.login") });
  const r1 = el("div", { className: "row" }); r1.append(u);
  const r2 = el("div", { className: "row" }); r2.append(pw);
  const r3 = el("div", { className: "row" }); r3.append(go);

  const submit = async () => {
    if (!u.value || !pw.value) return toast(t("auth.missing"), true);
    // btoa() is Latin-1 only; encodeURIComponent/unescape widens a UTF-8 password first.
    const basic = "Basic " + btoa(unescape(encodeURIComponent(u.value + ":" + pw.value)));
    const token = await withBusy(go, () => mintToken(basic));
    if (!token) return toast(t("auth.failed"), true);
    storeToken(token);
    // Curtain down again while the app loads, so a first sign-in looks like every later start:
    // one clean change from the curtain to a filled page.
    document.body.classList.remove("ready");
    startApp();
  };
  go.onclick = submit;
  pw.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });

  c.append(r1, r2, r3);
  main.append(c);
  u.focus();
}

// --- shared state ------------------------------------------------------------
let LOCATIONS = [];
let CATEGORIES = [];
const locName = (pk) => (LOCATIONS.find((l) => l.pk === pk) || {}).pathstring || "—";

function expiryPill(iso) {
  if (!iso) return el("span", { className: "pill", textContent: t("expiry.none") });
  const days = Math.round((new Date(iso) - new Date()) / 86400000);
  const date = fmtDate(iso);
  if (days < 0) {
    return el("span", { className: "pill bad", textContent: t("expiry.expiredOn", { date: date }) });
  }
  if (days <= WARN_DAYS) return el("span", { className: "pill warn", textContent: date });
  return el("span", { className: "pill ok", textContent: date });
}

/* A card holding one muted line — the loading, empty and error states of every list. Built
   with textContent, so a message from the server can never be read as markup. */
function hintCard(text, cls) {
  return el("div", { className: cls || "card hint", textContent: text });
}

// --- scan --------------------------------------------------------------------
async function lookup(code) {
  code = (code || "").trim();
  if (!code) return;
  $("#result").innerHTML = "";
  $("#result").append(hintCard(t("scan.searching")));
  let res;
  try {
    res = await api("/barcode/", { method: "POST", body: { barcode: code } });
  } catch (e) {
    /* An unknown barcode used to be a dead end that told the user to go and use another
       application. It is in fact the most common thing that happens with a new product, and
       the answer is a form: name it, file it, and the barcode is bound to it on the spot. */
    $("#result").innerHTML = "";
    const c = el("div", { className: "card" });
    c.append(el("h2", { className: "sec", textContent: t("scan.unknown") }));
    c.append(el("div", { className: "hint", textContent: t("scan.unknownHint", { code: code }) }));
    const go = labelButton("primary", "plus", t("scan.create"));
    go.style.marginTop = "12px";
    go.onclick = () => panelNewArticle(c, code);
    c.append(go);
    $("#result").append(c);
    return;
  }
  // A scan can resolve to a part, to one specific stock item, or to a shelf. Only the first
  // is the pantry case; the other two are answered honestly rather than silently ignored.
  $("#result").innerHTML = "";
  if (res.part && res.part.pk) return openPart(res.part.pk, "scan");
  if (res.stockitem && res.stockitem.pk) {
    const it = await api("/stock/" + res.stockitem.pk + "/?part_detail=true");
    return openPart(it.part, "scan");
  }
  if (res.stocklocation && res.stocklocation.pk) {
    // Scanning a shelf's own QR label filters the list to it.
    STOCK_FILTER = locName(res.stocklocation.pk);
    $("#tab-stock").click();
    return;
  }
  $("#result").append(hintCard(t("scan.noPart")));
}

/* Only ever one action panel open at a time — on a phone two stacked forms is a maze. */
let PANEL = null;
/* Set when the app opened a form by itself rather than the user asking for it. The back
   gesture must not spend a press closing something nobody opened. */
let PANEL_AUTO = false;

/* Part images live under /media/, which the inner Caddy puts behind forward_auth. An <img src>
   cannot carry an Authorization header, and Basic is refused there outright, so a plain src
   would 401 for anyone signed in with a token rather than a /web/ session — which, since
   v1.1, is everyone. Verified live 2026-09-14: /media/… answers 401 with no auth, 401 with
   Basic, 200 with the token header. Hence fetch + object URL. */
/* Cached per media URL, for the whole session. The overview draws one thumbnail per article
   and re-draws on every filter tap, so fetching them again each time would be pointless
   traffic; and there are tens of articles, not thousands, so nothing here needs evicting.
   Promises are cached, not URLs, so two rows asking at once share one request. */
const IMG_CACHE = new Map();

async function imageUrl(url) {
  if (IMG_CACHE.has(url)) return IMG_CACHE.get(url);
  const pending = (async () => {
    try {
      const res = await fetch(url, {
        credentials: "same-origin",
        headers: TOKEN ? { Authorization: "Token " + TOKEN } : {},
      });
      if (!res.ok) return null;
      return URL.createObjectURL(await res.blob());
    } catch (e) { return null; }
  })();
  IMG_CACHE.set(url, pending);
  return pending;
}

/* Put a /media/ picture into an <img>, through the token-carrying fetch above. */
async function authImage(img, url) {
  const u = await imageUrl(url);
  if (!u) return false;
  img.src = u;
  img.hidden = false;
  return true;
}

/* The little square in front of a list row: the article's photo, or its initial while there is
   none. Takes the PartBrief that comes attached to the stock row, so a list costs no extra
   request per article — only the image fetch, and that is cached.

   ⚠️ `thumbnail` is NEVER empty: for a part without a picture InvenTree substitutes
   /static/img/blank_image.thumbnail.png, which loads perfectly well and would put a grey
   placeholder graphic in place of our initial — and, worse, hide the fact that no photo has been
   set. `image` is the honest field: it is null in that case. */
function miniThumb(pd, name) {
  const img = el("img", { className: "mini", alt: "", hidden: true });
  const ph = el("div", { className: "mini empty",
                         textContent: (String(name || "?")[0] || "?").toUpperCase() });
  const src = (pd || {}).image ? (pd.thumbnail || pd.image) : null;
  if (src) authImage(img, src).then((ok) => { if (ok) ph.hidden = true; });
  return [img, ph];
}

/* Bumped on every detail render. A pending image poll checks it and gives up the moment the
   user has moved on, so scanning five things in a row does not leave five pollers running. */
let CARD_GEN = 0;

/* A freshly scanned product has no picture yet: the plugin queues the download on InvenTree's
   worker rather than making the scan wait nine seconds for openfoodfacts' image host. So look
   again a few times, then stop — the picture also simply appears on the next visit. */
async function pollImage(pk, img, gen) {
  for (let i = 0; i < 6; i++) {
    await new Promise((r) => setTimeout(r, 2000));
    if (gen !== CARD_GEN) return false;
    let p;
    try { p = await api("/part/" + pk + "/", { quiet: true }); } catch (e) { return false; }
    if (p.image) return await authImage(img, p.image);
  }
  return false;
}

function icon(name, size) {
  const n = size || 20;
  return '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" width="' + n
       + '" height="' + n + '"><path d="' + ICON[name] + '"/></svg>';
}

/* A button that is an icon plus a word. The icon goes in its own span so the flex gap on
   .btn spaces the two without a margin that would also apply to icon-only buttons. */
function labelButton(cls, name, text) {
  const b = el("button", { className: "btn " + cls });
  const ic = el("span", { className: "ic" });
  ic.innerHTML = icon(name);
  b.append(ic, el("span", { textContent: text }));
  return b;
}

function iconButton(title, name, onClick, extra) {
  const b = el("button", { className: "btn ghost iconbtn" + (extra ? " " + extra : ""),
                           title: title });
  b.setAttribute("aria-label", title);
  b.innerHTML = icon(name);
  b.onclick = onClick;
  return b;
}

const pencilButton = (title, fn) => iconButton(title, "pencil", fn);
const trashButton = (title, fn) => iconButton(title, "trash", fn, "warnink");

/* The footer line of a stock row: the date on the left, edit and delete on the right. Shared
   by both lists so they cannot drift apart. */
function rowFoot(item, onEdit, onDelete) {
  const foot = el("div", { className: "rowfoot" });
  foot.append(expiryPill(item.expiry_date));
  const acts = el("div", { className: "rowacts" });
  acts.append(pencilButton(t("batch.edit"), onEdit),
              trashButton(t("batch.delete"), onDelete));
  foot.append(acts);
  return foot;
}

/* Quantity as a 1..100 dropdown: on a phone that is a tap and a flick, where a number input is
   a keyboard covering half the screen. `current` is prepended when it falls outside the range
   or is fractional, so counting 250 g of something can never silently round it to 100. */
function qtySelect(current, selected) {
  const s = el("select");
  const vals = [];
  const cur = Number(current);
  if (isFinite(cur) && cur > 0 && (cur > 100 || !Number.isInteger(cur))) vals.push(cur);
  for (let i = 1; i <= 100; i++) vals.push(i);
  for (const v of vals) s.append(el("option", { value: String(v), textContent: fmtNum(v) }));
  const want = Number(selected);
  s.value = String(isFinite(want) && want > 0 ? want : 1);
  return s;
}

/* Pieces, kilograms or litres. The stored values are InvenTree's ("" for pieces); only the
   words are the reader's. */
function unitSelect() {
  const s = el("select");
  for (const [v, key] of [["", "unit.pieces"], ["kg", "unit.kg"], ["l", "unit.l"]]) {
    s.append(el("option", { value: v, textContent: t(key) }));
  }
  return s;
}

/* ---- Quantities in base units ------------------------------------------------------------
   A requirement like "rice" is a target in kilograms, not a number of packets: 4 kg stay 4 kg,
   whether in a 1-kg packet or an 18-kg sack. This app originally counted packets, and that
   worked right up until somebody bought a sack — 22.5 kg of rice read as "2 of 4".

   `Part.units` says what an article counts in ("" = pieces); the pack-content parameter on the
   product says how much is in one packet. Booking in still happens in packets, the app
   multiplies, and the base amount is what gets stored — InvenTree compares `low_stock` against
   exactly that number, so the shopping list stays right on the server side too. */
const PACK = new Map();          // product pk -> content per packet
const PACK_PARAM = new Map();    // product pk -> pk of that parameter, for later corrections
let PACK_TPL = null;             // pk of the pack-content parameter template

/* The REQUIREMENT decides, not the brand. A product brings a packet size along from its
   barcode, but whether that becomes kilograms or pieces is a property of the target: "passata"
   counts jars even though every jar says 500 g. Read the other way round, a freshly scanned
   product would be measured and the same product counted once assigned — the same number
   would mean two things. Only a product without a requirement answers for itself. */
function unitsOf(part) {
  if (!part) return "";
  /* ⚠️ A stock row carries only a PartBrief, and that has NO `variant_of`. Without the detour
     through the catalogue a row would not find its requirement and would show "4.5 ×" instead
     of "4.5 kg". */
  const full = (part.pk != null && PARTS.get(part.pk)) || part;
  if (full.variant_of) {
    const tpl = PARTS.get(full.variant_of);
    return (tpl && tpl.units) || "";
  }
  return full.units || "";
}

function packOf(part) {
  const v = PACK.get(part && part.pk);
  return isFinite(v) && v > 0 ? v : null;
}

// The reader's own notation, without the zeros nobody reads: 4,5 kg rather than 4,500 kg.
function fmtNum(x) {
  return (Number(x) || 0).toLocaleString(LOCALE, { maximumFractionDigits: 3 });
}

function fmtQty(x, units) {
  return units ? fmtNum(x) + " " + unitLabel(units) : fmtNum(x) + " ×";
}

/* Counted articles keep the 1..100 list; measured ones get a number field, because half a sack
   of rice is a valid amount and appears in no list of whole numbers. Both hand their value
   over through `.value`, so callers need not know which one they got. */
function qtyControl(part, current, selected) {
  if (!unitsOf(part)) return qtySelect(current, selected);
  const i = el("input", { type: "number", step: "0.01", min: "0" });
  i.value = String(Number(selected != null ? selected : current) || 0);
  return i;
}

/* A target in quarter steps, and not for looks.

   ⚠️ InvenTree only accepts numbers for `minimum_stock` that are exact binary fractions: 9.5
   is fine, 9.6 is refused with "no more than 6 decimal places" (checked live 2026-09-15). The
   serializer sends the value through a float, where 9.6 is 9.5999…9964. Stock quantities are
   NOT affected — they take 0.285 kg without complaint; it is only the target field.

   Rounded up, not to nearest: in an emergency supply, too much is the smaller problem. */
function roundTarget(x) {
  const v = Number(x) || 0;
  return Math.ceil(v * 4) / 4;
}

function qtyLabel(part, base) {
  const u = unitsOf(part);
  return u ? base + " (" + unitLabel(u) + ")" : base;
}

/* The pack content is stored on the product as soon as somebody has typed it — the next
   purchase of the same brand finds it already filled in. If saving fails that is acceptable:
   the booked amount is right regardless, only the pre-fill is missing. */
async function savePack(part, value) {
  if (!PACK_TPL || !(value > 0) || PACK.get(part.pk) === value) return;
  try {
    const pk = PACK_PARAM.get(part.pk);
    if (pk) {
      await api("/parameter/" + pk + "/", { method: "PATCH", body: { data: String(value) } });
    } else {
      const created = await api("/parameter/", {
        method: "POST",
        body: { model_type: "part", model_id: part.pk, template: PACK_TPL, data: String(value) },
      });
      PACK_PARAM.set(part.pk, created.pk);
    }
    PACK.set(part.pk, value);
  } catch (e) { /* the stock amount is right regardless */ }
}

function locSelect(selected) {
  const s = el("select");
  for (const l of LOCATIONS) {
    s.append(el("option", { value: String(l.pk), textContent: l.pathstring }));
  }
  if (selected) s.value = String(selected);
  return s;
}

function isoInDays(days) {
  const d = new Date();
  d.setDate(d.getDate() + (Number(days) || 0));
  return d.toISOString().slice(0, 10);
}

function field(text, control) {
  const w = el("div", { className: "field" });
  w.append(el("label", { textContent: text }), control);
  return w;
}

/* "in 3 days", "today", "3 days ago" — the remaining time in words, from the plural-aware
   strings. Used wherever a date alone would not say whether it is soon. */
function daysLeft(days) {
  if (days === 0) return t("days.today");
  return days < 0 ? t("days.ago", { n: -days }) : t("days.in", { n: days });
}

/* A date field that says, in the reader's language, what it is actually holding.

   Chrome draws <input type=date> in the BROWSER's interface language, not the page's —
   verified 2026-09-14 with Playwright: navigator.language was de-DE, Intl resolved to de-DE
   and toLocaleDateString gave 13.9.2028, yet the control still rendered 09/13/2028. "09/13"
   against "13/09" is indistinguishable for any day of the month up to 12, and this is a field
   about food safety. So the resolved date is spelled out underneath, with the month as a
   WORD — unambiguous in every language — together with the remaining shelf life, which is the
   number you actually think in. */
function dateField(labelText, value) {
  const input = el("input", { type: "date" });
  if (value) input.value = value;
  const hint = el("div", { className: "hint" });
  const draw = () => {
    if (!input.value) { hint.textContent = t("date.none"); return; }
    const days = Math.round((new Date(input.value) - new Date()) / 86400000);
    const long = new Date(input.value).toLocaleDateString(LOCALE,
      { day: "numeric", month: "long", year: "numeric" });
    hint.textContent = long + " · " + (days < 0 ? t("date.expired") : daysLeft(days));
  };
  input.addEventListener("input", draw);
  input.addEventListener("change", draw);
  draw();
  const wrap = field(labelText, input);
  wrap.append(hint);
  return { wrap: wrap, input: input };
}

/* Giving a part a picture. Open Food Facts covers the common groceries and nothing else —
   own jars, regional products, anything non-food — so when no photo was found (or the found
   one is wrong) you supply your own.

   TWO file inputs, not one, and that is the whole point of this function's shape: `capture`
   is the only way to make a browser go straight to the camera, but a single input carrying it
   then offers ONLY the camera and no gallery. One input with `capture`, one without, behind
   two labelled buttons, is the only arrangement where both paths are reliably available —
   relying on the platform's chooser to offer both was the earlier design and on Android it
   simply showed the gallery. */
/* Read a JPEG's EXIF orientation AND its stored pixel size, in one pass over the header.

   Both are needed, and the second one is the part that took a measurement to learn: browsers
   apply the EXIF rotation themselves when decoding, and Chromium does so **even when asked
   not to** — `createImageBitmap(file, {imageOrientation: "none"})` still returned 200×400 for
   a 400×200 file tagged "rotate 90°" (verified 2026-09-15 against generated fixtures). A
   transform applied on top of that turns the picture twice, which is exactly the 90°-out
   thumbnails this replaced.

   So we do not guess and we do not trust a flag: comparing the decoded bitmap against the
   size actually stored in the file says whether the decoder already did the work.

   Only the first APP1 segment is walked, and only the first IFD — that is where tag 0x0112
   lives. Anything unexpected yields orientation 1, i.e. "leave it alone". */
function jpegInfo(file) {
  return new Promise((resolve) => {
    const fallback = { orientation: 1, width: 0, height: 0 };
    const fr = new FileReader();
    fr.onerror = () => resolve(fallback);
    fr.onload = () => {
      const info = { orientation: 1, width: 0, height: 0 };
      try {
        const v = new DataView(fr.result);
        if (v.getUint16(0) !== 0xffd8) return resolve(fallback);   // not a JPEG at all
        let off = 2;
        while (off + 4 <= v.byteLength) {
          const marker = v.getUint16(off);
          if ((marker & 0xff00) !== 0xff00) break;
          const size = v.getUint16(off + 2);

          if (marker === 0xffe1 && !info.orientation2) {
            const start = off + 4;
            if (v.getUint32(start) === 0x45786966) {               // "Exif"
              const tiff = start + 6;
              const little = v.getUint16(tiff) === 0x4949;
              const ifd = tiff + v.getUint32(tiff + 4, little);
              const count = v.getUint16(ifd, little);
              for (let i = 0; i < count; i++) {
                const entry = ifd + 2 + i * 12;
                if (v.getUint16(entry, little) === 0x0112) {
                  info.orientation = v.getUint16(entry + 8, little) || 1;
                  break;
                }
              }
            }
          }

          // SOF0..SOF15 carry the frame header; DHT/DRI/JPG share the 0xFFCx range and must
          // not be mistaken for it.
          const m = marker & 0xff;
          if (m >= 0xc0 && m <= 0xcf && m !== 0xc4 && m !== 0xc8 && m !== 0xcc) {
            info.height = v.getUint16(off + 5);
            info.width = v.getUint16(off + 7);
            break;                                                 // both known, stop
          }
          off += 2 + size;
        }
      } catch (e) { /* malformed header is not worth a failure */ }
      resolve(info);
    };
    // The header is all that matters; never pull a 5 MB photo into memory for twelve bytes.
    fr.readAsArrayBuffer(file.slice(0, 256 * 1024));
  });
}

/* Does this browser apply EXIF orientation when it decodes an image?

   It has to be measured, not assumed and not asked: Chromium applies the rotation even when
   passed `imageOrientation: "none"` (verified 2026-09-15), so the flag lies, and applying our
   own rotation on top produced thumbnails 90° out. Comparing stored size against decoded size
   only answers it for quarter turns — a 180° file has the same dimensions either way, which is
   how that case stayed broken one round longer.

   So: decode a 2×1 pixel JPEG tagged "rotate 90°" once. If it comes back 1×2, the decoder
   does the work and we must keep our hands off. Measured once per session and remembered. */
let EXIF_AUTO = null;
const EXIF_PROBE = "data:image/jpeg;base64,/9j/4QAiRXhpZgAATU0AKgAAAAgAAQESAAMAAAABAAYAAAAAAAD/4AAQSkZJRgABAQAAAQABAAD/2wBDACgcHiMeGSgjISMtKygwPGRBPDc3PHtYXUlkkYCZlo+AjIqgtObDoKrarYqMyP/L2u71////m8H////6/+b9//j/2wBDASstLTw1PHZBQXb4pYyl+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj/wAARCAABAAIDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwCrRRRXOewf/9k=";

async function decoderAppliesExif() {
  if (EXIF_AUTO !== null) return EXIF_AUTO;
  try {
    const blob = await (await fetch(EXIF_PROBE)).blob();
    const bmp = await createImageBitmap(blob);
    EXIF_AUTO = bmp.width === 1 && bmp.height === 2;
    if (bmp.close) bmp.close();
  } catch (e) {
    EXIF_AUTO = true;   // every current engine does; assuming so cannot double-rotate
  }
  return EXIF_AUTO;
}

/* Shrink, straighten and re-encode a picked photo before it is uploaded.

   A phone camera hands over 3-5 MB at 4000×3000 for something this app shows at 96px, and
   newer cameras hand over HEIC, which the server's Pillow refuses outright ("Upload a valid
   image") — that failure looks to the user exactly like "taking a photo does nothing".
   Drawing it through a canvas fixes both at once. Straightening has to happen here too,
   because a canvas drops EXIF and the stored JPEG gets no second chance to be rotated.

   The rotation is applied ONLY if the decoder did not already do it — see jpegInfo(). On every
   current browser it has, and then this does nothing but scale.

   Any failure falls through to the original file rather than blocking the upload: a browser
   that cannot decode the format here probably could not have shown it either, and the server
   gets the last word. */
async function prepareImage(file) {
  const MAX = 1600;
  try {
    const info = await jpegInfo(file);
    const bmp = await createImageBitmap(file);

    // If the decoder already straightened the picture, straightening it again turns it twice.
    const orientation = (await decoderAppliesExif()) ? 1 : info.orientation;

    const scale = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width * scale));
    const h = Math.max(1, Math.round(bmp.height * scale));

    const canvas = document.createElement("canvas");
    canvas.width = orientation >= 5 ? h : w;
    canvas.height = orientation >= 5 ? w : h;

    const ctx = canvas.getContext("2d");
    switch (orientation) {
      case 2: ctx.translate(w, 0); ctx.scale(-1, 1); break;
      case 3: ctx.translate(w, h); ctx.rotate(Math.PI); break;
      case 4: ctx.translate(0, h); ctx.scale(1, -1); break;
      case 5: ctx.rotate(0.5 * Math.PI); ctx.scale(1, -1); break;
      case 6: ctx.rotate(0.5 * Math.PI); ctx.translate(0, -h); break;
      case 7: ctx.rotate(0.5 * Math.PI); ctx.translate(w, -h); ctx.scale(-1, 1); break;
      case 8: ctx.rotate(-0.5 * Math.PI); ctx.translate(-w, 0); break;
      default: break;
    }
    ctx.drawImage(bmp, 0, 0, w, h);
    if (bmp.close) bmp.close();

    const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.85));
    if (blob && blob.size) return new File([blob], "foto.jpg", { type: "image/jpeg" });
  } catch (e) {
    console.warn("prepareImage fell back to the original file:", e);
  }
  return file;
}

function thumbPicker(part, onDone) {
  const img = el("img", { className: "thumb", alt: "", hidden: true });
  const ph = el("div", { className: "thumb empty", textContent: t("photo.placeholder") });

  const upload = async (input) => {
    const f = input.files && input.files[0];
    input.value = "";          // so picking the same file twice fires change again
    if (!f) return;            // the user backed out of the camera

    toast(t("photo.saving"));
    // The picture itself carries the spinner, and both picture buttons are locked: shrinking
    // a phone photo and sending it can take several seconds on a weak connection.
    wrap.classList.add("busy");
    const locked = (result.buttons || []).filter((b) => !b.disabled);
    for (const b of locked) b.disabled = true;
    try {
      const prepared = await prepareImage(f);
      const fd = new FormData();
      fd.append("image", prepared, prepared.name || "foto.jpg");
      await api("/part/" + part.pk + "/", { method: "PATCH", body: fd });
      IMG_CACHE.clear();
      toast(t("photo.saved"));
      onDone();
    } catch (e) {
      toast(t("photo.failed", { error: e.message }), true);
    } finally {
      wrap.classList.remove("busy");
      for (const b of locked) b.disabled = false;
    }
  };

  const gallery = el("input", { type: "file", accept: "image/*" });
  gallery.hidden = true;
  gallery.onchange = () => upload(gallery);

  const camera = el("input", { type: "file", accept: "image/*" });
  camera.setAttribute("capture", "environment");
  camera.hidden = true;
  camera.onchange = () => upload(camera);

  const pick = () => gallery.click();
  const shoot = () => camera.click();
  // An existing picture opens large; an empty frame goes straight to the camera. Tapping where
  // a photo is missing means "take one" far more often than "let me browse my gallery", and
  // the gallery is still one button away underneath.
  img.onclick = () => lightbox(img.src, part.full_name || part.name);
  img.title = t("photo.enlarge");
  ph.onclick = shoot;
  ph.title = t("photo.take");

  const wrap = el("div", { className: "thumbwrap" });
  wrap.append(img, ph, gallery, camera);
  // `buttons` is filled in by the caller with the two picture buttons it draws.
  const result = { wrap: wrap, img: img, ph: ph, pick: pick, shoot: shoot, buttons: [] };
  return result;
}

/* Full-screen view of the picture. Deliberately trivial: an overlay, the image, and any tap
   or Escape closes it. It reuses the object URL the thumbnail already holds, so opening it
   costs no request. */
function lightbox(src, alt) {
  if (!src) return;
  const box = el("div", { className: "lightbox" });
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-label", alt || t("photo.image"));

  const big = el("img", { src: src, alt: alt || "" });
  const close = el("button", { className: "btn ghost iconbtn lbclose" });
  close.setAttribute("aria-label", t("common.close"));
  close.innerHTML = icon("close", 24);

  const shut = () => {
    box.remove();
    document.removeEventListener("keydown", onKey);
  };
  function onKey(e) { if (e.key === "Escape") shut(); }

  box.onclick = shut;
  close.onclick = shut;
  document.addEventListener("keydown", onKey);

  box.append(close, big);
  document.body.append(box);
}

function openPanel(host, build, auto) {
  closePanel();
  PANEL_AUTO = !!auto;
  PANEL = el("div", { className: "panel" });
  build(PANEL);
  host.append(PANEL);
  revealPanel(PANEL);
}

/* Put an opened form's top just under the sticky header.

   `scrollIntoView({block:"nearest"})` fell short twice over: it does nothing when the element
   is already *technically* on screen — including when it sits behind the sticky header — and
   when it does move, it moves as little as possible, which on a tall form leaves the buttons
   below the fold. Computing the offset puts the whole form where it can be read and reached.
   Instantly, not smoothly: a form still gliding under a thumb is a mis-tap waiting to happen. */
function revealPanel(panel) {
  if (!panel.getBoundingClientRect) return;
  const header = document.querySelector("header");
  const headerH = header ? header.getBoundingClientRect().height : 0;
  const delta = panel.getBoundingClientRect().top - headerH - 12;
  if (Math.abs(delta) > 2) window.scrollBy(0, delta);
}

function closePanel() {
  if (PANEL) { PANEL.remove(); PANEL = null; }
  PANEL_AUTO = false;
}

function panelButtons(panel, okText, onOk, danger) {
  const ok = el("button", { className: "btn " + (danger ? "danger" : "primary"),
                            textContent: okText });
  const no = el("button", { className: "btn ghost", textContent: t("common.cancel") });
  no.onclick = closePanel;
  // Validation inside onOk throws (see withBusy): the message is shown and the button comes back.
  ok.onclick = () => withBusy(ok, onOk, [no], true).catch((e) => toast(e.message, true));
  const r = el("div", { className: "buttons" });
  r.append(ok, no);
  panel.append(r);
}

async function loadStock(pk) {
  const stock = await api("/stock/?part=" + pk + "&in_stock=true&limit=100");
  return (stock.results || stock || []).slice()
    .sort((a, b) => ((a.expiry_date || "9999") < (b.expiry_date || "9999") ? -1 : 1));
}

/* Which article is on screen, and which ones we walked through to get here.

   Detail pages link to each other: a requirement lists its varieties, a product suggests
   requirements it might belong to. Before this, all of them came back to the TAB, so opening a
   variety from "Nudeln" and going back landed in the shopping list rather than in "Nudeln" —
   one step out of the way instead of one step back. */
let DETAIL_PK = null;
const DETAIL_STACK = [];
const DETAIL_STACK_MAX = 10;      // deep enough for any real path, shallow enough to stay sane

/* Open an article's detail page.

   `from` is a TAB ("stock", "buy", …) when the page is entered from a list — that starts a
   fresh path. It is "detail" when one article opens another, which pushes the current one onto
   the stack. Without it we are walking back out and neither is touched. */
function openPart(pk, from, opts) {
  /* One history entry per opened page, created from the click itself.

     ⚠️ Everything used to hang off ONE spare entry that the popstate handler kept pushing
     back. That broke as soon as the button on the page was used: it navigated without spending
     an entry, the stack got out of step by one, and the next Android gesture fell out of the
     app instead of back into the list. The rule now: going forward creates an entry, going
     back spends exactly one. */
  if (!(opts && opts.noHistory)) armHistory();
  if (from === "detail") {
    if (DETAIL_PK != null && DETAIL_PK !== pk) {
      DETAIL_STACK.push(DETAIL_PK);
      if (DETAIL_STACK.length > DETAIL_STACK_MAX) DETAIL_STACK.shift();
    }
  } else if (from) {
    DETAIL_STACK.length = 0;
    DETAIL_FROM = from;
  }
  DETAIL_PK = pk;
  LAST_OPENED = pk;
  showTab("detail");
  saveView("detail", pk);
  const back = $("#detailback");
  back.innerHTML = "";
  const bi = el("span", { className: "ic" });
  bi.innerHTML = icon("back");
  const prev = DETAIL_STACK.length ? PARTS.get(DETAIL_STACK[DETAIL_STACK.length - 1]) : null;
  back.append(bi, el("span", {
    // Naming the article you came from is the whole point: "Back" alone left it open whether
    // the button leads one step back or all the way out to the list.
    textContent: prev ? t("nav.backTo", { name: prev.name || prev.full_name })
               : DETAIL_FROM === "stock" ? t("nav.backToStock") : t("nav.back"),
  }));
  return showPart(pk);
}

/* One step back: to the article we came from, or out to the list when there is none. The system
   back gesture and the button on the page both end up here, so they cannot disagree. */
/* Called ONLY from the popstate handler — the entry has already been spent at this point, so
   going back creates no new one. The button on the page calls `history.back()` and lands here,
   rather than being a second kind of navigation that could disagree with the gesture. */
function detailBack() {
  const prev = DETAIL_STACK.pop();
  if (prev != null) { openPart(prev, null, { noHistory: true }); return; }
  DETAIL_PK = null;
  showTab(DETAIL_FROM);
}

/* The detail page: everything known about one article, and the only place it can be changed.
   The overview deliberately carries no controls — it is a list to read at arm's length while
   standing at a shelf, and a row full of buttons is a row you mis-tap. */
/* ---------------- matching a scanned product to what is already here ----------------

   No embeddings, no vector store, and that is a considered choice rather than a shortcut.
   Three signals are already in the data, and together they decide almost every case:

     1. CATEGORY. Open Food Facts returns the product's category on a scan and the OFF plugin
        already maps it onto our own tree. A requirement lives in a category, so this alone
        cuts 83 candidates down to the handful in that category — before anything is computed.
     2. WORDS, with compounds in mind. "Mehl" is literally contained in "Dinkelmehl", "面粉"
        in "高筋面粉". A substring test over normalised words catches what a synonym model would
        be asked for, for the words that actually occur on packaging. The words come from
        words() above, which knows that Chinese is written without spaces.
     3. WHAT YOU DID BEFORE. If a product in the same category already hangs under a
        requirement, the next one of that kind probably belongs there too. Nearest neighbour
        over a feature we have, without calling it that.

   An embedding model would add a dependency (a service, or a model on a phone in a shop with
   one bar of signal) to rank a list the category has already narrowed to five. The honest
   place for semantics, if it is ever needed, is the OFF plugin on the server — not the
   handset. And every suggestion here is one tap away from being corrected, which is the part
   that makes a cheap heuristic acceptable where a wrong answer is cheap. */

function suggestRequirements(name, categoryPk) {
  const own = words(name);
  const plain = String(name || "").toLowerCase();
  if (!own.length) return [];

  // How often an already-assigned product of this category chose a given requirement.
  const habit = new Map();
  for (const p of PARTS.values()) {
    if (p.is_template || !p.variant_of) continue;
    if (categoryPk && p.category !== categoryPk) continue;
    habit.set(p.variant_of, (habit.get(p.variant_of) || 0) + 1);
  }

  const out = [];
  for (const tpl of PARTS.values()) {
    if (!tpl.is_template) continue;

    let wordScore = 0;
    const why = [];
    for (const w of words(tpl.name)) {
      if (!strongWord(w)) continue;
      if (own.indexOf(w) >= 0) { wordScore += 4; why.push(t("suggest.word", { word: w })); }
      else if (plain.indexOf(w) >= 0) {
        wordScore += 3; why.push(t("suggest.inName", { word: w }));
      }
    }

    const sameCat = !!(categoryPk && tpl.category === categoryPk);
    if (!wordScore && !sameCat) continue;
    out.push({ t: tpl, wordScore: wordScore, sameCat: sameCat, habit: habit.get(tpl.pk) || 0,
               why: why.slice(0, 2).join(", ") || t("suggest.sameCategory") });
  }

  /* Ranked in tiers, not summed, and that distinction had to be learned twice. As a plain sum
     "same category" (+5) beat a matching word (+4), so "Erdbeer Marmelade" was offered
     "Backpulver" while "Marmelade / Konfitüre" sat one rank below. Dropping the category instead
