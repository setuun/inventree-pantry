  // error at save time instead of a choice.
  CATEGORIES = (cats.results || cats || [])
    .filter((c) => !c.structural)
    .sort((a, b) => byName(a.pathstring, b.pathstring));

  await firstData;

  // A reload should leave you where you were. Only a genuinely fresh session starts at the
  // stock list.
  if (!(await restoreView())) showTab("stock");
  ready();
}

/* Android's back gesture, made to mean what it means everywhere else.

   A page like this has exactly one history entry, so the system back button leaves the app on
   the first press — from the detail page too, which is the one place it obviously should not.
   The fix is to keep one spare entry permanently on top of the stack: back then pops that
   instead of leaving, we get a popstate, and we decide what "back" means.

   Order matters and mirrors what is visually on top: a lightbox closes first, then an open
   form, then the detail page returns to the list. Only at the top level does back mean leave —
   and then only on the second press within a couple of seconds, which is the convention
   Android apps use and the reason a mis-swipe no longer costs you the page. */
const HISTORY_GUARD = { vorrat: "guard" };
let LEAVE_ARMED = false;

function armHistory() {
  try { history.pushState(HISTORY_GUARD, ""); } catch (e) { /* not fatal */ }
}

window.addEventListener("popstate", () => {
  const lb = document.querySelector(".lightbox");
  if (lb) { lb.remove(); armHistory(); return; }

  // A form the app opened by itself is dismissed on the way past, not instead of navigating:
  // spending a back press on something the user never opened reads as "nothing happened".
  if (PANEL && !PANEL_AUTO) { closePanel(); armHistory(); return; }
  if (PANEL) closePanel();

  const detail = $("#view-detail");
  // Nothing is pushed back here: this page's entry was created when it opened and is spent by
  // this very back. One more spare entry would be exactly the one-too-many that once put the
  // gesture out of step.
  if (detail && !detail.hidden) { detailBack(); return; }

  if (LEAVE_ARMED) {
    /* Actually leave. Simply not re-arming is not enough and that was the bug: the press had
       already been spent popping the guard, so the app stayed put and a THIRD press was
       needed — while the hint promised the second would do it. Going back once more here is
       what makes the promise true. Deferred out of the handler, because navigating from
       inside a popstate is ignored by some engines. If there is nothing behind the app (a PWA
       launched from the home screen), this is what closes it, which is the same intent. */
    setTimeout(() => history.back(), 0);
    return;
  }

  LEAVE_ARMED = true;
  toast(t("nav.backAgainToLeave"));
  setTimeout(() => { LEAVE_ARMED = false; }, 2500);
  armHistory();
});

/* Three rungs, cheapest first. Rung 2 is the one that matters in practice: somebody who is
   already signed in to InvenTree in this browser is carried straight through without ever
   seeing a form — the session is silently traded for a token that then outlives it. */
(async function boot() {
  // Configuration before language (it carries the household's default), language before
  // anything is drawn.
  await loadConfig();
  applyConfig();
  await loadLanguage();
  applyStatic(document);
  drawLanguagePicker();
  setTimeout(ready, 15000);

  $("#mark").innerHTML = icon("box", 22);
  $("#ver").textContent = "v" + VERSION;
  $("#logout").onclick = () => signOut(null);
  armHistory();

  try { TOKEN = localStorage.getItem(TOKEN_KEY); } catch (e) { TOKEN = null; }

  if (TOKEN) {
    try {
      ME = await api("/user/me/", { quiet: true });
      return startApp();
    } catch (e) { storeToken(null); ME = null; }
  }

  const fromSession = await mintToken(null);
  if (fromSession) {
    storeToken(fromSession);
    try {
      ME = await api("/user/me/", { quiet: true });
      return startApp();
    } catch (e) { storeToken(null); ME = null; }
  }

  showLogin(null);
})();
</script>
</body>
</html>
